<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landa Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--mute:#6b7280;--line:#e5e7eb;--brand:#0f766e;--brand2:#14b8a6;
--warn:#b45309;--warnbg:#fef3c7;--danger:#b91c1c;--dangerbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--ok:#15803d;--okbg:#dcfce7}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:220px;background:#111827;color:#cbd5e1;padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .logo{color:#fff;font-weight:700;font-size:17px;padding:4px 10px 18px}
aside .logo small{display:block;color:#94a3b8;font-weight:400;font-size:12px}
aside a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px;white-space:nowrap}
aside a:hover{background:#1f2937}
aside a.on{background:var(--brand);color:#fff}
aside .foot{margin-top:auto;padding:10px;font-size:12px;color:#94a3b8;display:flex;justify-content:space-between;align-items:center;gap:8px}
aside .foot a{display:inline;padding:0;color:#cbd5e1;text-decoration:underline;margin:0}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-right:6px}
.sync i.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.badge{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:8px}
main{flex:1;padding:24px 28px 60px;min-width:0}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px;margin-bottom:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.two{grid-template-columns:1.2fr 1fr}
.half{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.kpi .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi .v.sm{font-size:18px}
.kpi .h{font-size:12px;color:var(--mute)}
.kpi.gold{background:linear-gradient(135deg,#fffbeb,#fff);border-color:#fcd34d}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600;background:#fafafa}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:8px;padding:7px 12px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:#fff;color:var(--brand)}
.btn.sm{padding:3px 9px;font-size:12px;font-weight:600}
.btn.red{background:#fff;color:var(--danger);border-color:#fca5a5}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}
.p-new{background:var(--infobg);color:var(--info)}.p-packed{background:var(--warnbg);color:var(--warn)}
.p-dispatched{background:#ede9fe;color:#6d28d9}.p-delivered{background:var(--okbg);color:var(--ok)}
.p-cancelled{background:#f3f4f6;color:#6b7280}.p-received{background:var(--warnbg);color:var(--warn)}.p-sorted{background:var(--okbg);color:var(--ok)}
.p-sorting{background:#ede9fe;color:#6d28d9}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;margin-bottom:8px;text-decoration:none;color:var(--ink)}
.alert b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.a-danger{background:var(--dangerbg)}.a-danger b{color:var(--danger)}
.a-warn{background:var(--warnbg)}.a-warn b{color:var(--warn)}
.a-info{background:var(--infobg)}.a-info b{color:var(--info)}
.a-gold{background:#fef9c3}.a-gold b{color:#854d0e}
.dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.a-danger .dot{background:var(--danger)}.a-warn .dot{background:var(--warn)}.a-info .dot{background:var(--info)}.a-gold .dot{background:#ca8a04}
.pipe{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pipe a{flex:1;min-width:120px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-decoration:none;color:var(--ink)}
.pipe a .v{font-size:20px;font-weight:700}.pipe a .l{font-size:12px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px}
.bars div{flex:1;background:var(--brand2);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div:hover{background:var(--brand)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
.meter{height:6px;background:#eef2f7;border-radius:3px;width:90px;display:inline-block;vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.low{color:var(--danger);font-weight:700}
.up{color:var(--ok);font-weight:600}.down{color:var(--danger);font-weight:600}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs a{padding:5px 12px;border-radius:99px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px}
.tabs a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sortgrid input{width:80px;padding:6px;border:1px solid var(--line);border-radius:6px;font:inherit;text-align:right}
.muted{color:var(--mute)}
.empty{padding:30px;text-align:center;color:var(--mute)}
details summary{cursor:pointer}
details[open] summary{margin-bottom:12px}
.liverow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 14px}
.liverow label{font-size:12px;font-weight:600;color:var(--mute)}
.liverow select{display:block;margin-top:4px;padding:9px 12px;border:2px solid var(--brand);border-radius:8px;font:inherit;font-size:16px;font-weight:700;min-width:200px}
.counters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
.gbtn{border:0;border-radius:14px;padding:14px 10px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;transition:transform .08s}
.gbtn:active{transform:scale(.96)}
.gbtn span{font-size:13px;font-weight:600;opacity:.9}
.gbtn b{font-size:36px;line-height:1.1}
.gbtn small{font-size:11px;opacity:.85}
.g-A{background:#15803d}.g-B{background:#1d4ed8}.g-C{background:#b45309}.g-Reject{background:#6b7280}.undo{background:#111827}
.g{display:inline-block;min-width:26px;text-align:center;border-radius:6px;color:#fff;font-weight:700;padding:1px 6px;font-size:12px}
.flash{animation:flash .6s}
@keyframes flash{from{background:#fef08a}to{background:transparent}}
.brandbtns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.bigpiece{font-size:15px;margin:0}
#lock{position:fixed;inset:0;background:#111827;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
#lock[hidden]{display:none}
#lock form{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:360px;text-align:center}
#lock .ic{font-size:34px}
#lock input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;margin:14px 0 10px;text-align:center}
#lock .btn{width:100%;justify-content:center;padding:10px}
#lock .err{color:var(--danger);font-weight:600;min-height:20px;margin-top:10px}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:10;overflow:auto}
#modal[hidden]{display:none}
#modal form{background:#fff;border-radius:14px;padding:20px;width:100%;max-width:560px}
#modal label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:10px}
#modal input,#modal select{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;color:var(--ink)}
#modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal .line{display:grid;grid-template-columns:1fr 80px 90px 30px;gap:6px;margin-bottom:6px}
#modal .line input,#modal .line select{margin:0}
#modal .x{border:0;background:#fee2e2;color:var(--danger);border-radius:6px;cursor:pointer}
#modal .foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:10px}
#modal .err{color:var(--danger);font-weight:600}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw}
#toast.show{opacity:1}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.set label{font-size:12px;font-weight:600;color:var(--mute)}
.set input{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
code{background:#f3f4f6;padding:2px 6px;border-radius:5px;font-size:13px;word-break:break-all}
@media(max-width:860px){
  body{flex-direction:column}
  aside{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:4px}
  aside .logo{display:none}
  aside .foot{margin:0}
  .two,.half{grid-template-columns:1fr}
  .counters{grid-template-columns:repeat(3,1fr)}
  main{padding:16px}
}
@media print{aside,.btn{display:none}}
</style>
</head>
<body>
<aside id="nav"></aside>
<main id="app"></main>
<div id="modal" hidden></div>
<div id="lock" hidden>
  <form id="lockForm">
    <div class="ic">🔒</div>
    <h1>Landa Dashboard</h1>
    <p class="muted">Enter the password to continue</p>
    <input type="password" name="pw" autocomplete="current-password" placeholder="Password" required>
    <button class="btn">Unlock</button>
    <div class="err" id="lockErr"></div>
  </form>
</div>
<div id="toast"></div>
<script>
/* ---------- connection ---------- */
const SUPA_URL = 'https://ajevxwdgmpaakjkffvmf.supabase.co';
// Public "anon" key — safe to ship. Every table is locked behind the
// dashboard password by row level security (see supabase/setup.sql).
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqZXZ4d2RnbXBhYWtqa2Zmdm1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNjE5NzIsImV4cCI6MjEwMDYzNzk3Mn0.bB97bHOFgCeMUTYUraOArzvXAkFRHxiajrCg3gwCGrc';
const T = name => 'landa_clothing_wholesale_business_' + name;
const TOKEN_KEY = 'landa-dashboard-session';

/* ---------- basics ---------- */
const GRADES = ['A', 'B', 'C', 'Reject'];
const FLOW = ['new', 'packed', 'dispatched', 'delivered'];
const LABEL = {new:'New', packed:'Packed', dispatched:'Dispatched', delivered:'Delivered', cancelled:'Cancelled', received:'Waiting to sort', sorting:'Sorting now', sorted:'Sorted'};
const COURIERS = ['TCS', 'Leopards', 'M&P', 'Daewoo Cargo', 'Own vehicle', 'Other'];

const $ = s => document.querySelector(s);
const iso = d => d.toLocaleDateString('en-CA');
const today = () => iso(new Date());
const ago = n => iso(new Date(Date.now() - n * 864e5));
const age = d => Math.round((new Date(today()) - new Date(d)) / 864e5);
const rs = n => 'Rs ' + Math.round(n || 0).toLocaleString('en-PK');
const num = n => Math.round(n || 0).toLocaleString('en-PK');
const sum = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = k => k.replace('|', ' · ');
const pill = s => `<span class="pill p-${s}">${LABEL[s]}</span>`;
const clock = ts => new Date(ts).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
const since = ts => { const s = (Date.now() - new Date(ts)) / 1000; return s < 60 ? Math.max(0, Math.round(s)) + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : iso(new Date(ts)); };
const route = () => (location.hash.slice(1) || 'dashboard').split('/');
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms); }
let actx;
function beep() { try { actx = actx || new AudioContext(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .09); } catch (e) {} }

let S = null;
const ZERO = {qty: 0, price: 0, min: 0};
const ST = k => S.stock[k] || ZERO;
const cust = id => S.customers.find(c => c.id === id) || {name: '(deleted)', city: '', phone: ''};
const total = o => sum(o.lines, l => l.qty * l.price);
const due = o => o.status === 'cancelled' ? 0 : total(o) - (o.paid || 0);
const custDue = id => sum(S.orders.filter(o => o.customerId === id), due);
const live = o => o.status !== 'cancelled';

/* ---------- database ---------- */
let sb, token = sessionStorage.getItem(TOKEN_KEY), channel = null, liveOK = false;
function makeClient() {
  sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
    auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false},
    global: {headers: token ? {'x-landa-session': token} : {}},
  });
}
async function rpc(name, args = {}) {
  const {data, error} = await sb.rpc(T(name), args);
  if (error) { if (/Locked/.test(error.message)) showLock('Session expired — log in again'); throw new Error(error.message); }
  return data;
}
async function q(query) { const {data, error} = await query; if (error) throw new Error(error.message); return data; }
async function all(build) {
  let out = [];
  for (let from = 0; ; from += 1000) {
    const d = await q(build().range(from, from + 999));
    out = out.concat(d);
    if (d.length < 1000) return out;
  }
}
const tb = n => sb.from(T(n));

async function loadAll() {
  const [set, cats, stock, bales, yields, custs, orders, lines, log, liveRow, brands, devices, pending] = await Promise.all([
    q(tb('settings').select('*').eq('id', 1).maybeSingle()),
    q(tb('categories').select('name').order('sort_order').order('name')),
    all(() => tb('stock_items').select('*').order('category')),
    all(() => tb('bales_received').select('*').order('created_at', {ascending: false})),
    all(() => tb('bale_yield_totals').select('*').order('bale_id')),
    all(() => tb('wholesale_customers').select('*').order('name')),
    all(() => tb('customer_orders').select('*').order('created_at', {ascending: false})),
    all(() => tb('customer_order_lines').select('order_id,category,grade,qty,price').order('id')),
    q(tb('activity_log').select('happened_on,message').order('id', {ascending: false}).limit(200)),
    q(tb('live_sorting_session').select('*').eq('id', 1).maybeSingle()),
    q(tb('brand_piece_counts').select('*').order('pieces', {ascending: false}).limit(300)),
    q(tb('sensor_devices').select('id,name,last_seen').order('id')),
    q(tb('sorted_pieces').select('id,bale_id,category,grade,source,created_at').is('brand', null).neq('source', 'bulk').order('id').limit(50)),
  ]);
  if (!set) { showLock('Session expired — log in again'); throw new Error('Locked'); }
  const recent = liveRow?.bale_id
    ? await q(tb('sorted_pieces').select('id,bale_id,category,grade,brand,source,created_at').eq('bale_id', liveRow.bale_id).neq('source', 'bulk').order('id', {ascending: false}).limit(15))
    : [];
  const byBale = {}, byOrder = {};
  S = {
    settings: {bizName: set.biz_name, alertEmail: set.alert_email, sortDays: set.sort_days, dispatchDays: set.dispatch_days,
      dueDays: set.due_days, runoutDays: set.runout_days, deadDays: set.dead_days, lockoutSeconds: set.sensor_lockout_seconds,
      emailUrl: set.email_webapp_url || '', dailyDigest: set.email_daily_digest !== false, instantAlerts: set.email_instant_alerts !== false,
      robotAt: set.email_robot_connected_at || null, emailReady: 'email_webapp_url' in set},
    categories: cats.map(c => c.name),
    stock: Object.fromEntries(stock.map(s => [s.category + '|' + s.grade, {qty: s.qty, price: +s.price, min: s.min_qty}])),
    bales: bales.map(b => byBale[b.id] = {id: b.id, date: b.received_date, supplier: b.supplier, type: b.bale_type,
      weightKg: +b.weight_kg, cost: +b.cost, status: b.status, sortedDate: b.sorted_date, yield: {}}),
    customers: custs.map(c => ({id: c.id, name: c.name, city: c.city, phone: c.phone, limit: +c.credit_limit})),
    orders: orders.map(o => byOrder[o.id] = {id: o.id, date: o.order_date, customerId: o.customer_id, status: o.status, paid: +o.paid,
      courier: o.courier, tracking: o.tracking, history: o.history || [], lines: []}),
    log: log.map(l => ({d: l.happened_on, t: l.message})),
    live: {baleId: liveRow?.bale_id || null, category: liveRow?.category || null},
    brands, devices, pending, recent,
  };
  yields.forEach(y => { if (byBale[y.bale_id]) byBale[y.bale_id].yield[y.category + '|' + y.grade] = y.qty; });
  lines.forEach(l => { if (byOrder[l.order_id]) byOrder[l.order_id].lines.push({key: l.category + '|' + l.grade, qty: l.qty, price: +l.price}); });
}

let refreshing = null, again = false, lastPieceId = null;
function refresh() {
  if (refreshing) { again = true; return refreshing; }
  refreshing = (async () => {
    try {
      do { again = false; await loadAll(); } while (again);
      const top = S.recent[0]?.id || 0;
      if (lastPieceId !== null && top > lastPieceId && route()[0] === 'sorting') beep();
      lastPieceId = top;
      render(true);
    } catch (e) { if (e.message !== 'Locked') toast(e.message); }
    finally { refreshing = null; }
  })();
  return refreshing;
}
function subscribe() {
  if (channel) sb.removeChannel(channel);
  let t;
  channel = sb.channel('landa-sync-' + Math.random().toString(36).slice(2))
    .on('postgres_changes', {event: '*', schema: 'public', table: T('sync_pings')}, () => { clearTimeout(t); t = setTimeout(refresh, 120); })
    .subscribe(status => { const was = liveOK; liveOK = status === 'SUBSCRIBED'; drawNav(); if (liveOK && !was) refresh(); });
}

/* ---------- login ---------- */
function showLock(msg) {
  $('#lock').hidden = false;
  $('#lockErr').textContent = msg || '';
  setTimeout(() => $('#lock input').focus(), 50);
}
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('.btn');
  btn.disabled = true; $('#lockErr').textContent = '';
  token = null; makeClient();
  const {data, error} = await sb.rpc(T('unlock_dashboard'), {p_password: f.pw.value, p_device: navigator.userAgent});
  btn.disabled = false;
  if (error) { $('#lockErr').textContent = /schema cache|does not exist/.test(error.message) ? 'Database is not set up yet' : error.message; f.pw.select(); return; }
  token = data; sessionStorage.setItem(TOKEN_KEY, token); f.reset();
  start();
});
async function start() {
  makeClient();
  if (!token) return showLock();
  const {data, error} = await sb.rpc(T('session_is_valid'));
  if (error) return showLock(/schema cache|does not exist/.test(error.message) ? 'Database is not set up yet — run supabase/setup.sql' : 'Cannot reach the database: ' + error.message);
  if (!data) { sessionStorage.removeItem(TOKEN_KEY); token = null; makeClient(); return showLock(); }
  $('#lock').hidden = true;
  try { await loadAll(); } catch (e) { return; }
  lastPieceId = S.recent[0]?.id || 0;
  render();
  subscribe();
}

/* ---------- analytics ---------- */
function velocity(days = 14) {
  const v = {};
  S.orders.filter(o => live(o) && age(o.date) < days).forEach(o => o.lines.forEach(l => v[l.key] = (v[l.key] || 0) + l.qty));
  return v;
}
function salesAgg(fromAge, toAge) {
  const m = {};
  S.orders.filter(o => live(o) && age(o.date) >= fromAge && age(o.date) < toAge).forEach(o => o.lines.forEach(l => {
    const r = m[l.key] || (m[l.key] = {key: l.key, pcs: 0, rev: 0, orders: 0, custs: new Set()});
    r.pcs += l.qty; r.rev += l.qty * l.price; r.orders++; r.custs.add(o.customerId);
  }));
  return m;
}
function bestSeller(days = 30) { return Object.values(salesAgg(0, days)).sort((a, b) => b.pcs - a.pcs)[0]; }
function supplierForCategory(cat) {
  const m = {};
  S.bales.filter(b => b.status !== 'received').forEach(b => GRADES.forEach(g => {
    const q = b.yield[cat + '|' + g]; if (!q) return;
    const s = m[b.supplier] || (m[b.supplier] = {name: b.supplier, pcs: 0, a: 0});
    s.pcs += q; if (g === 'A') s.a += q;
  }));
  return Object.values(m).filter(s => s.pcs >= 20).sort((x, y) => y.a / y.pcs - x.a / x.pcs)[0];
}
function alerts() {
  const A = [], st = S.settings, v = velocity(), push = (lvl, type, text, go) => A.push({lvl, type, text, go});
  Object.entries(S.stock).forEach(([k, s]) => {
    if (s.min > 0 && s.qty <= s.min) push(s.qty <= 0 ? 'danger' : 'warn', 'Low stock', `${label(k)} is down to ${num(s.qty)} pcs (minimum ${s.min})`, '#inventory');
    else if (v[k] && s.qty > 0) {
      const cover = s.qty / (v[k] / 14);
      if (cover <= st.runoutDays) push('info', 'Selling fast', `${label(k)} will run out in ~${Math.max(1, Math.round(cover))} days at current pace (${v[k]} sold in 14 days)`, '#inventory');
    }
  });
  S.bales.filter(b => b.status !== 'sorted' && age(b.date) >= st.sortDays)
    .forEach(b => push('warn', 'Sorting delay', `Bale ${b.id} (${b.type}, ${b.weightKg} kg) arrived ${age(b.date)} days ago and is still ${b.status === 'sorting' ? 'being sorted' : 'not sorted'} — ${rs(b.cost)} of cash sitting idle`, '#sorting/' + b.id));
  S.orders.filter(o => (o.status === 'new' || o.status === 'packed') && age(o.date) >= st.dispatchDays)
    .forEach(o => push('warn', 'Dispatch late', `${o.id} for ${cust(o.customerId).name} is ${LABEL[o.status].toLowerCase()} but not sent — ${age(o.date)} days old`, '#orders'));
  S.orders.filter(o => due(o) > 0 && age(o.date) >= st.dueDays)
    .forEach(o => push('danger', 'Payment overdue', `${cust(o.customerId).name} owes ${rs(due(o))} on ${o.id} (${age(o.date)} days)`, '#orders'));
  S.customers.forEach(c => { const d = custDue(c.id); if (c.limit && d > c.limit) push('danger', 'Credit limit', `${c.name} owes ${rs(d)} — over their ${rs(c.limit)} limit. Hold new orders until paid.`, '#customers'); });
  const moving = velocity(st.deadDays);
  const dead = Object.entries(S.stock).filter(([k, s]) => s.qty >= 150 && !moving[k]);
  if (dead.length) push('info', 'Not moving', `${dead.length} items have 150+ pcs and no sales in ${st.deadDays} days: ${dead.slice(0, 5).map(([k, s]) => `${label(k)} (${num(s.qty)})`).join(', ')}${dead.length > 5 ? '…' : ''}. Consider a bundle deal.`, '#inventory');
  const rank = {danger: 0, warn: 1, info: 2};
  return A.sort((a, b) => rank[a.lvl] - rank[b.lvl]);
}
function supplierStats() {
  const m = {};
  S.bales.forEach(b => {
    const s = m[b.supplier] || (m[b.supplier] = {name: b.supplier, bales: 0, sorted: 0, kg: 0, cost: 0, pcs: 0, a: 0, rej: 0});
    s.bales++;
    if (b.status !== 'sorted') return;
    s.sorted++; s.kg += b.weightKg; s.cost += b.cost;
    Object.entries(b.yield).forEach(([k, q]) => { s.pcs += q; const g = k.split('|')[1]; if (g === 'A') s.a += q; if (g === 'Reject') s.rej += q; });
  });
  return Object.values(m).sort((x, y) => (y.pcs ? y.a / y.pcs : 0) - (x.pcs ? x.a / x.pcs : 0));
}

PAGES.insights = arg => {
  const PERIODS = [[7, '7 days'], [30, '30 days'], [90, '90 days'], [365, '1 year'], [0, 'All time']];
  const days = PERIODS.some(p => p[0] === +arg) && arg !== undefined ? +arg : 30;
  const plabel = PERIODS.find(p => p[0] === days)[1];
  const span = days || Math.max(1, ...S.orders.map(o => age(o.date) + 1));
  const cur = salesAgg(0, days || Infinity), prev = days ? salesAgg(days, days * 2) : {};
  const items = Object.values(cur).sort((a, b) => b.pcs - a.pcs);
  const tabs = `<div class="tabs">${PERIODS.map(([d, t]) => `<a href="#insights/${d}" class="${d === days ? 'on' : ''}">${t}</a>`).join('')}</div>`;
  const top = head('Best sellers', 'What sells, what earns, who buys — worked out from every order');
  if (!items.length) return top + tabs + `<div class="card empty">No sales in the last ${plabel.toLowerCase()} yet.</div>`;
  const totPcs = sum(items, r => r.pcs), totRev = sum(items, r => r.rev);
  const best = items[0], earner = [...items].sort((a, b) => b.rev - a.rev)[0];
  const group = (keyFn) => { const m = {}; items.forEach(r => { const k = keyFn(r); const x = m[k] || (m[k] = {name: k, pcs: 0, rev: 0}); x.pcs += r.pcs; x.rev += r.rev; }); return Object.values(m).sort((a, b) => b.rev - a.rev); };
  const cats = group(r => r.key.split('|')[0]), grades = group(r => r.key.split('|')[1]);
  const custs = {}; S.orders.filter(o => live(o) && age(o.date) < (days || Infinity)).forEach(o => { const c = custs[o.customerId] || (custs[o.customerId] = {id: o.customerId, rev: 0, pcs: 0, orders: 0}); c.rev += total(o); c.pcs += sum(o.lines, l => l.qty); c.orders++; });
  const custList = Object.values(custs).sort((a, b) => b.rev - a.rev);
  const trend = r => { if (!days) return ''; const p = prev[r.key]?.pcs || 0; if (!p) return '<span class="up">new</span>'; const d = (r.pcs - p) / p * 100; return `<span class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '↑' : '↓'} ${Math.abs(Math.round(d))}%</span>`; };
  const cover = r => { const left = ST(r.key).qty, rate = r.pcs / span; return left <= 0 ? 0 : rate ? left / rate : Infinity; };

  const sig = [];
  sig.push({lvl: 'gold', type: 'Best seller', text: `${label(best.key)} is your #1 — ${num(best.pcs)} pcs (${Math.round(best.pcs / totPcs * 100)}% of everything sold) for ${rs(best.rev)} in ${plabel.toLowerCase()}.`, go: '#inventory'});
  const bc = cover(best);
  if (bc < S.settings.runoutDays * 2) sig.push({lvl: 'warn', type: 'Restock', text: `${label(best.key)} has ${bc === 0 ? 'run out' : `only ~${Math.round(bc)} days of stock left`} at this pace. Sort more ${best.key.split('|')[0]} bales first — and since it sells anyway, there's room to raise its price a little.`, go: '#sorting'});
  const topCat = cats[0], sup = supplierForCategory(topCat.name);
  sig.push({lvl: 'info', type: 'Top category', text: `${topCat.name} brings in the most money: ${rs(topCat.rev)} (${Math.round(topCat.rev / totRev * 100)}% of sales).${sup ? ` ${sup.name} gives you the most A-grade ${topCat.name} (${Math.round(sup.a / sup.pcs * 100)}% A) — buy ${topCat.name} bales from them.` : ''}`, go: '#bales'});
  if (days) {
    const risers = items.filter(r => (prev[r.key]?.pcs || 0) >= 20).map(r => ({r, d: (r.pcs - prev[r.key].pcs) / prev[r.key].pcs})).sort((a, b) => b.d - a.d);

AFTER.sorting = id => {
  const d = $('#handCount'); if (d) d.addEventListener('toggle', () => handOpen = d.open);
  const lc = $('#liveCat');
  if (lc) lc.addEventListener('change', () => q(tb('live_sorting_session').update({category: lc.value, updated_at: new Date().toISOString()}).eq('id', 1)).then(refresh).catch(e => toast(e.message)));
  const f = $('#sortForm'); if (!f) return;
  const open = S.bales.filter(b => b.status !== 'sorted');
  const b = open.find(x => x.id === id) || open.find(x => x.id === S.live.baleId) || open[0];
  const read = () => { const y = {}; [...f.querySelectorAll('input[type=number]')].forEach(i => { if (+i.value > 0) y[i.name] = Math.floor(+i.value); }); return y; };
  const upd = () => {
    const y = read(), t = sum(Object.values(y), q => q), a = sum(Object.entries(y).filter(([k]) => k.endsWith('|A')), e => e[1]);
    S.categories.forEach(c => { const el = f.querySelector(`[data-rt="${CSS.escape(c)}"]`); if (el) el.textContent = num(sum(GRADES, g => y[c + '|' + g])); });

/* brand popup — one per piece counted */
let brandShowing = null, brandSnooze = 0;
function maybeBrandPopup() {
  const m = $('#modal');
  if (route()[0] !== 'sorting' || !S.pending.length) { if (!m.hidden && m.dataset.kind === 'brand' && !m.dataset.edit) m.hidden = true; return; }
  if (!m.hidden && m.dataset.kind !== 'brand') return;
  const next = S.pending.find(p => p.id > brandSnooze);

  if (!m.hidden && brandShowing === next.id) { const w = m.querySelector('#waiting'); if (w) w.textContent = S.pending.length > 1 ? `${S.pending.length - 1} more waiting` : ''; return; }
  openBrand(next);
}
function openBrand(p, edit) {

async function mailer(action, extra = {}) {
  await saveMail();

function modal(title, body, onSave, saveText = 'Save', kind = '') {
  const m = $('#modal');
  m.innerHTML = `<form><h2>${title}</h2>${body}<div class="foot"><span class="err"></span><div class="btns"><button type="button" class="btn ghost" data-close>Close</button><button class="btn" type="submit">${saveText}</button></div></div></form>`;
  m.dataset.kind = kind; m.dataset.edit = '';
  m.hidden = false;
  const f = m.querySelector('form');
  f.querySelector('[data-close]').onclick = () => m.hidden = true;
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try {
      const err = await onSave(f);
      if (err) f.querySelector('.err').textContent = err;
      else { m.hidden = true; await refresh(); }
    } catch (x) { f.querySelector('.err').textContent = x.message; }
    btn.disabled = false;
  };
  const first = f.querySelector('input:not([type=hidden]),select'); first && first.focus();
  return f;
}
const ACT = {
  newBale() {
    const sups = [...new Set(S.bales.map(b => b.supplier))];
    modal('New bale received', `<datalist id="sups">${sups.map(s => `<option value="${esc(s)}">`).join('')}</datalist>
      <div class="row"><label>Date<input type="date" name="date" value="${today()}" required></label><label>Supplier<input name="supplier" list="sups" required></label></div>
      <label>Bale type / grade<input name="type" placeholder="e.g. Mixed Ladies, Jeans, Winter" required></label>
      <div class="row"><label>Weight (kg)<input type="number" name="weightKg" min="1" step="any" required></label><label>Total cost incl. transport (Rs)<input type="number" name="cost" min="0" required></label></div>`,
      async f => { const id = await rpc('add_bale', {p_date: f.date.value, p_supplier: f.supplier.value, p_type: f.type.value, p_weight: +f.weightKg.value, p_cost: +f.cost.value}); toast(`${id} logged — sort it when ready`); });
  },
  editStock(k) {
    const s = ST(k), [category, grade] = k.split('|');
    modal(esc(label(k)), `<div class="row"><label>Pieces in stock (stock count)<input type="number" name="qty" value="${s.qty}"></label><label>Selling price / pc (Rs)<input type="number" name="price" min="0" value="${s.price}"></label></div>
      <label>Alert me when stock falls to (pcs)<input type="number" name="min" min="0" value="${s.min}"></label>`,
      f => rpc('update_stock_item', {p_category: category, p_grade: grade, p_qty: Math.round(+f.qty.value), p_price: +f.price.value, p_min: Math.round(+f.min.value)}).then(() => null));
  },
  newOrder() {
    if (!S.customers.length) { toast('Add a wholesaler first'); location.hash = '#customers'; return; }
    const opts = Object.entries(S.stock).filter(([, v]) => v.qty > 0).map(([k, v]) => `<option value="${esc(k)}">${esc(label(k))} — ${num(v.qty)} left</option>`).join('');
    if (!opts) { toast('Nothing in stock to sell yet'); return; }
    const row = () => `<div class="line"><select name="key">${opts}</select><input name="qty" type="number" min="1" placeholder="Qty"><input name="price" type="number" min="0" placeholder="Rs/pc"><button type="button" class="x">×</button></div>`;
    const f = modal('New order', `<div class="row"><label>Wholesaler<select name="cust">${S.customers.map(c => `<option value="${c.id}">${esc(c.name)} — ${esc(c.city)}</option>`).join('')}</select></label>
      <label>Date<input type="date" name="date" value="${today()}"></label></div>
      <label>Items <span class="muted" style="font-weight:400">(item · qty · price per piece)</span></label><div id="lines">${row()}</div>
      <button type="button" class="btn ghost sm" id="addLine">+ Add item</button>
      <div class="row" style="margin-top:12px"><label>Advance received (Rs)<input type="number" name="paid" value="0" min="0"></label><label>Order total<input id="ot" disabled></label></div>
      <div id="credit" class="err"></div>`,
      async f => {
        const lines = [...f.querySelectorAll('.line')].map(r => { const [category, grade] = r.querySelector('[name=key]').value.split('|'); return {category, grade, qty: Math.floor(+r.querySelector('[name=qty]').value), price: +r.querySelector('[name=price]').value}; });
        if (!lines.length || lines.some(l => !(l.qty > 0))) return 'Every item needs a quantity';
        const id = await rpc('create_order', {p_customer: f.cust.value, p_date: f.date.value, p_lines: lines, p_paid: +f.paid.value || 0});
        toast(`${id} created — stock reserved`);
      }, 'Create order');
    const setPrice = r => { r.querySelector('[name=price]').value = ST(r.querySelector('[name=key]').value).price; };
    const upd = () => {
      const t = sum([...f.querySelectorAll('.line')], r => +r.querySelector('[name=qty]').value * +r.querySelector('[name=price]').value);
      f.querySelector('#ot').value = rs(t);
      const c = S.customers.find(x => x.id === f.cust.value), d = custDue(c.id);
      f.querySelector('#credit').textContent = c.limit && d + t - (+f.paid.value || 0) > c.limit ? `⚠ ${c.name} already owes ${rs(d)} — this order takes them over their ${rs(c.limit)} limit` : '';
    };
    f.querySelectorAll('.line').forEach(setPrice);
    f.querySelector('#addLine').onclick = () => { f.querySelector('#lines').insertAdjacentHTML('beforeend', row()); setPrice(f.querySelector('.line:last-child')); };
    f.addEventListener('click', e => { if (e.target.classList.contains('x')) { e.target.parentNode.remove(); upd(); } });
    f.addEventListener('change', e => { if (e.target.name === 'key') setPrice(e.target.parentNode); upd(); });
    f.addEventListener('input', upd); upd();
  },
  async advance(id) {
    const o = S.orders.find(x => x.id === id);
    if (o.status === 'packed') {
      return modal(`Dispatch ${o.id}`, `<div class="row"><label>Courier / transport<select name="courier">${COURIERS.map(c => `<option>${c}</option>`).join('')}</select></label><label>Tracking / bilty no.<input name="tracking"></label></div>
        <p class="muted">After saving, hit “WhatsApp” on the order to send the tracking to ${esc(cust(o.customerId).name)}.</p>`,
        async f => { await rpc('set_order_status', {p_order: o.id, p_status: 'dispatched', p_courier: f.courier.value, p_tracking: f.tracking.value}); toast(`${o.id} dispatched`); }, 'Mark dispatched');
    }
    const nxt = FLOW[FLOW.indexOf(o.status) + 1];
    await rpc('set_order_status', {p_order: o.id, p_status: nxt}); toast(`${o.id} → ${LABEL[nxt]}`); refresh();
  },
  async cancel(id) { if (confirm(`Cancel ${id}? Stock goes back into inventory.`)) { await rpc('set_order_status', {p_order: id, p_status: 'cancelled'}); refresh(); } },
  pay(id) {
    const o = S.orders.find(x => x.id === id);
    modal(`Payment for ${o.id}`, `<p>${esc(cust(o.customerId).name)} owes <b>${rs(due(o))}</b> of ${rs(total(o))}.</p><label>Amount received (Rs)<input type="number" name="amt" min="1" value="${due(o)}"></label>`,
      async f => { if (!(+f.amt.value > 0)) return 'Enter an amount'; await rpc('add_payment', {p_order: o.id, p_amount: +f.amt.value}); toast('Payment recorded'); });
  },
  editCust(id) {
    const c = S.customers.find(x => x.id === id) || {};
    modal(id ? 'Edit wholesaler' : 'New wholesaler', `<label>Name / shop<input name="name" value="${esc(c.name)}" required></label>
      <div class="row"><label>City<input name="city" value="${esc(c.city)}"></label><label>WhatsApp (92300…)<input name="phone" value="${esc(c.phone)}"></label></div>
      <label>Credit limit (Rs, 0 = none)<input type="number" name="limit" min="0" value="${c.limit || 0}"></label>`,
      async f => { await rpc('save_customer', {p_id: id || null, p_name: f.name.value, p_city: f.city.value, p_phone: f.phone.value.replace(/\D/g, ''), p_limit: +f.limit.value || 0}); });
  },
  async goLive(id) {
    await q(tb('live_sorting_session').update({bale_id: id, category: S.live.category || S.categories[0], updated_at: new Date().toISOString()}).eq('id', 1));
    toast(`${id} is now live — sensor boxes count into it`); refresh();
  },
  async piece(grade) {
    await rpc('record_one_piece', {p_grade: grade});
    refresh();
  },
  async undo() {
    const r = await rpc('undo_last_piece', {});
    toast(r ? `Removed piece #${r}` : 'Nothing to undo'); refresh();
  },
  async finishBale(id) {
    const b = S.bales.find(x => x.id === id), t = sum(Object.values(b.yield), q => q);
    if (!confirm(`Finish ${id}? ${num(t)} pcs have been counted. You can't add more pieces to it after this.`)) return;
    await rpc('finish_bale_sorting', {p_bale: id}); toast(`${id} finished`); refresh();
  },
  editBrand(id) {
    const p = S.recent.find(x => x.id === +id) || S.pending.find(x => x.id === +id);
    if (p) openBrand({bale_id: S.live.baleId, ...p}, true);
  },
  newDevice() {
    modal('Add sensor box', `<label>Name<input name="name" placeholder="e.g. Sorting table 1" required></label>`, async f => {
      const d = await rpc('create_sensor_device', {p_name: f.name.value});
      setTimeout(() => modal('Sensor box added', `<p>Put these into the ESP32 code. <b>The key is shown only once</b> — copy it now.</p>
        <label>Device ID<input readonly value="${esc(d.id)}"></label><label>Secret key<input readonly value="${esc(d.key)}"></label>`, () => null, 'Done'), 50);
    }, 'Create');
  },
  wa(id) {
    const o = S.orders.find(x => x.id === id), c = cust(o.customerId);
    const msg = o.status === 'dispatched'
      ? `Assalam o Alaikum ${c.name},\nYour order ${o.id} (${num(sum(o.lines, l => l.qty))} pcs) has been dispatched via ${o.courier || 'courier'}${o.tracking ? `, tracking ${o.tracking}` : ''}.\nTotal ${rs(total(o))}, balance due ${rs(due(o))}.\n— ${S.settings.bizName}`
      : `Assalam o Alaikum ${c.name},\nYour order ${o.id} is packed and ready (${num(sum(o.lines, l => l.qty))} pcs, ${rs(total(o))}). We will dispatch shortly.\n— ${S.settings.bizName}`;
    window.open(`https://wa.me/${c.phone}?text=${encodeURIComponent(msg)}`, '_blank');
  },
  remind(id) {
    const c = cust(id), os = S.orders.filter(o => o.customerId === id && due(o) > 0);
    const msg = `Assalam o Alaikum ${c.name},\nFriendly reminder of your pending balance with ${S.settings.bizName}:\n${os.map(o => `• ${o.id} (${o.date}): ${rs(due(o))}`).join('\n')}\nTotal: ${rs(custDue(id))}\nJazakAllah.`;
    window.open(`https://wa.me/${c.phone}?text=${encodeURIComponent(msg)}`, '_blank');
  },
  async testEmail() {
    toast('Sending test email…', 20000);
    const d = await mailer('test');
    toast(`✅ Test email sent from ${d.from} to ${d.sentTo.join(', ')} — check the inbox (and spam)`, 7000);
  },
  async connectEmail() {
    toast('Connecting email robot…', 20000);
    const robotToken = await rpc('create_email_robot_session');
    const d = await mailer('connect', {robotToken});
    toast('✅ ' + d.message, 6000); refresh();
  },
  async emailDigest() {
    if (S.settings.emailUrl) {
      toast('Sending digest…', 20000);
      const d = await mailer('digest');
      return toast(`✅ Digest emailed to ${d.sentTo.join(', ')}`, 6000);
    }
    const to = S.settings.alertEmail;
    if (!to) { toast('Set up email alerts in Settings first'); location.hash = '#settings'; return; }
    const A = alerts(), bs = bestSeller(30);
    const body = `${S.settings.bizName} — daily digest ${today()}\n\n${A.map(a => `[${a.type}] ${a.text}`).join('\n') || 'All clear.'}\n\nBest seller (30 days): ${bs ? `${label(bs.key)} — ${bs.pcs} pcs` : '—'}\nStock: ${num(sum(Object.values(S.stock), s => s.qty))} pcs · To collect: ${rs(sum(S.orders, due))}`;
    location.href = `mailto:${to}?subject=${encodeURIComponent(`${S.settings.bizName}: ${A.length} alerts (${today()})`)}&body=${encodeURIComponent(body)}`;
  },
  waDigest() {
    const A = alerts();
    window.open(`https://wa.me/?text=${encodeURIComponent(`*${S.settings.bizName} — ${today()}*\n\n${A.map(a => `• *${a.type}*: ${a.text}`).join('\n') || 'All clear.'}`)}`, '_blank');
  },
  slip(id) {
    const o = S.orders.find(x => x.id === id), c = cust(o.customerId), w = window.open('', '_blank');
    w.document.write(`<title>${o.id}</title><body style="font:14px system-ui;padding:30px;max-width:700px">
      <h2 style="margin:0">${esc(S.settings.bizName)}</h2><p>Invoice / packing slip <b>${o.id}</b> · ${o.date}</p>
      <p><b>${esc(c.name)}</b><br>${esc(c.city)} · ${esc(c.phone)}</p>
      <table style="width:100%;border-collapse:collapse" border="1" cellpadding="6"><tr><th align="left">Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>
      ${o.lines.map(l => `<tr><td>${esc(label(l.key))}</td><td align="right">${l.qty}</td><td align="right">${num(l.price)}</td><td align="right">${num(l.qty * l.price)}</td></tr>`).join('')}
      <tr><td colspan="3" align="right"><b>Total</b></td><td align="right"><b>${rs(total(o))}</b></td></tr>
      <tr><td colspan="3" align="right">Paid</td><td align="right">${rs(o.paid)}</td></tr>
      <tr><td colspan="3" align="right"><b>Balance</b></td><td align="right"><b>${rs(due(o))}</b></td></tr></table>
      <p>${o.courier ? `Sent via ${esc(o.courier)} ${esc(o.tracking || '')}` : ''}</p><script>print()<\/script>`);
    w.document.close();
  },
  csv(what) {
    const T2 = {
      bales: [['ID', 'Date', 'Supplier', 'Type', 'Kg', 'Cost', 'Status', 'Pieces'], S.bales.map(b => [b.id, b.date, b.supplier, b.type, b.weightKg, b.cost, b.status, sum(Object.values(b.yield), q => q)])],
      inventory: [['Category', 'Grade', 'Qty', 'Min', 'Price', 'Value'], Object.entries(S.stock).map(([k, s]) => [...k.split('|'), s.qty, s.min, s.price, s.qty * s.price])],
      orders: [['ID', 'Date', 'Wholesaler', 'City', 'Items', 'Pieces', 'Total', 'Paid', 'Due', 'Status', 'Courier', 'Tracking'], S.orders.map(o => [o.id, o.date, cust(o.customerId).name, cust(o.customerId).city, o.lines.map(l => `${label(l.key)} x${l.qty}`).join('; '), sum(o.lines, l => l.qty), total(o), o.paid, due(o), o.status, o.courier || '', o.tracking || ''])],
      customers: [['ID', 'Name', 'City', 'Phone', 'Credit limit', 'Owes'], S.customers.map(c => [c.id, c.name, c.city, c.phone, c.limit, custDue(c.id)])],
    }[what];
    const csv = [T2[0], ...T2[1]].map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
    download(`${what}-${today()}.csv`, csv, 'text/csv');
  },
  backup() { download(`landa-backup-${today()}.json`, JSON.stringify(S, (k, v) => v instanceof Set ? [...v] : v), 'application/json'); },
  async demo() {
    if (!confirm('This WIPES all bales, orders and wholesalers and loads demo data. Continue?')) return;
    await loadDemo();
  },
  async wipe() {
    if (prompt('This deletes ALL bales, orders, wholesalers and history (categories and prices stay). Type WIPE to confirm.') !== 'WIPE') return;
    await rpc('wipe_all_business_data'); toast('Everything wiped — fresh start'); refresh();
  },
  async logout() {
    try { await sb.rpc(T('logout_dashboard')); } catch (e) {}
    sessionStorage.removeItem(TOKEN_KEY); location.hash = ''; location.reload();
  },
};
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); }

/* ---------- demo data ---------- */
async function loadDemo() {
  const say = t => toast(t, 60000);
  say('Loading demo data… 0%');
  await rpc('wipe_all_business_data');
  const base = {'Ladies Tops': 250, 'Jeans': 450, 'Jackets': 900, 'Sweaters': 400, 'Men Shirts': 300, 'Kids Wear': 180}, mult = {A: 1, B: .6, C: .3, Reject: .08};
  const cats = Object.keys(base);
  for (const c of cats) await rpc('add_category', {p_name: c});
  const price = (c, g) => Math.round(base[c] * mult[g] / 10) * 10;
  await Promise.all(cats.flatMap(c => GRADES.map(g => rpc('update_stock_item', {p_category: c, p_grade: g, p_qty: 0, p_price: price(c, g), p_min: g === 'A' ? 60 : g === 'B' ? 40 : 0}))));
  say('Loading demo data… 20%');
  const mk = (cs, pcs, aPct) => cs.flatMap(c => {
    const per = pcs / cs.length, a = Math.round(per * aPct), r = Math.round(per * .08), b = Math.round(per * (1 - aPct - .08) * .6);
    return [['A', a], ['B', b], ['C', Math.round(per) - a - b - r], ['Reject', r]].map(([grade, qty]) => ({category: c, grade, qty}));
  });
  const bales = [
    [28, 'UK Cream Export', 'Mixed Ladies', 450, 180000, 26, ['Ladies Tops', 'Jeans'], 1400, .45],
    [24, 'Korea Mix Traders', 'Winter Mix', 500, 160000, 22, ['Jackets', 'Sweaters'], 900, .30],
    [18, 'Gulf Bales (Dubai)', 'Mixed Men', 450, 120000, 16, ['Men Shirts', 'Jeans'], 1300, .22],
    [10, 'UK Cream Export', 'Kids + Ladies', 300, 110000, 9, ['Kids Wear', 'Ladies Tops'], 1200, .48],
    [6, 'Korea Mix Traders', 'Jeans', 450, 150000],
    [1, 'Gulf Bales (Dubai)', 'Mixed Ladies', 450, 115000],
  ];
  const baleIds = [];
  for (const [d, supplier, type, kg, cost, sd, cs, pcs, a] of bales) {
    const id = await rpc('add_bale', {p_date: ago(d), p_supplier: supplier, p_type: type, p_weight: kg, p_cost: cost});
    baleIds.push(id);
    if (sd) await rpc('record_bulk_sorting', {p_bale: id, p_yields: mk(cs, pcs, a), p_finish: true, p_date: ago(sd)});
  }
  say('Loading demo data… 45%');
  const cids = [];
  for (const [name, city, phone, limit] of [['Haji Rafiq Traders', 'Karachi', '923001234567', 300000], ['Al-Madina Garments', 'Lahore', '923211234567', 250000],
    ['Faisal Cloth House', 'Faisalabad', '923331234567', 60000], ['Karkhano Wholesale', 'Peshawar', '923451234567', 200000]])
    cids.push(await rpc('save_customer', {p_id: null, p_name: name, p_city: city, p_phone: phone, p_limit: limit}));
  const orders = [
    [20, 0, [['Ladies Tops', 'A', 200], ['Jeans', 'A', 120]], 'delivered', 1],
    [15, 1, [['Jackets', 'A', 80], ['Sweaters', 'B', 100]], 'delivered', .5],
    [14, 2, [['Men Shirts', 'B', 200], ['Jeans', 'B', 150]], 'delivered', 0],
    [12, 3, [['Jeans', 'A', 60], ['Ladies Tops', 'A', 90]], 'delivered', 1],
    [8, 0, [['Jeans', 'A', 150], ['Kids Wear', 'A', 150]], 'dispatched', 0],
    [5, 3, [['Jackets', 'B', 60], ['Sweaters', 'A', 80], ['Jeans', 'A', 100]], 'packed', 0],
    [1, 1, [['Kids Wear', 'B', 120], ['Ladies Tops', 'B', 150], ['Jeans', 'A', 50]], 'new', .3],
    [0, 2, [['Ladies Tops', 'A', 100]], 'new', 0],
  ];
  for (const [d, ci, lines, st, paidPct] of orders) {
    const ls = lines.map(([category, grade, qty]) => ({category, grade, qty, price: price(category, grade)}));
    const tot = sum(ls, l => l.qty * l.price);
    const id = await rpc('create_order', {p_customer: cids[ci], p_date: ago(d), p_lines: ls, p_paid: Math.round(tot * paidPct)});
    const steps = FLOW.slice(1, FLOW.indexOf(st) + 1);
    for (let i = 0; i < steps.length; i++)
      await rpc('set_order_status', {p_order: id, p_status: steps[i], p_courier: ['TCS', 'Daewoo Cargo', 'Leopards'][i % 3], p_tracking: 'TRK' + (700000 + d * 37), p_date: ago(Math.max(0, d - 1 - i))});
  }
  say('Loading demo data… 75%');
  const live = baleIds[4];
  await q(tb('live_sorting_session').update({bale_id: live, category: 'Jeans', updated_at: new Date().toISOString()}).eq('id', 1));
  const brands = ["Levi's", "Levi's", 'Wrangler', 'Lee', 'Zara', "Levi's", 'H&M', 'Diesel', 'Wrangler', 'No brand', "Levi's", 'Lee', 'Zara', 'Tommy Hilfiger', "Levi's", 'Calvin Klein', 'Wrangler', 'H&M'];
  for (let i = 0; i < brands.length + 2; i++)
    await rpc('record_one_piece', {p_grade: ['A', 'A', 'B', 'A', 'C', 'B', 'A', 'Reject'][i % 8], p_brand: brands[i] || null});
  say('Demo data loaded ✓');
  location.hash = '#dashboard';
  await refresh();
}

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  e.preventDefault();
  if (b.disabled) return;
  const done = () => { b.disabled = false; };
  if (b.tagName === 'BUTTON') b.disabled = true;
  Promise.resolve().then(() => ACT[b.dataset.act](b.dataset.id)).catch(err => toast(err.message)).finally(done);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { $('#modal [data-close]')?.click(); return; }
  if (route()[0] !== 'sorting' || !$('#modal').hidden || !S?.live.baleId || !$('.counters')) return;
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const g = {a: 'A', b: 'B', c: 'C', r: 'Reject'}[e.key.toLowerCase()];
  if (g) { e.preventDefault(); ACT.piece(g).catch(err => toast(err.message)); }
  else if (e.key.toLowerCase() === 'u') { e.preventDefault(); ACT.undo().catch(err => toast(err.message)); }
});

function render(keep) {
  if (!S) return;
  const [pg, arg] = route();
  const p = PAGES[pg] ? pg : 'dashboard';
  let saved = null, focusName = null;
  const y = window.scrollY;
  if (keep) {
    saved = [...$('#app').querySelectorAll('input[name]:not([data-nokeep]),select[name]:not([data-nokeep])')].filter(e => e.type !== 'checkbox').map(e => [e.name, e.value]);
    focusName = $('#app').contains(document.activeElement) ? document.activeElement.name : null;
  }
  drawNav();
  $('#app').innerHTML = PAGES[p](arg);
  if (saved) saved.forEach(([n, v]) => { const e = $('#app').querySelector(`[name="${CSS.escape(n)}"]:not([data-nokeep])`); if (e) e.value = v; });
  AFTER[p] && AFTER[p](arg);
  if (keep) { window.scrollTo(0, y); if (focusName) $('#app').querySelector(`[name="${CSS.escape(focusName)}"]`)?.focus(); }
  else window.scrollTo(0, 0);
  maybeBrandPopup();
}
window.addEventListener('hashchange', () => render());
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) refresh(); });
setInterval(() => { if (S && !document.hidden) refresh(); }, 60000);
start();
</script>
