<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landa Dashboard</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{color-scheme:light;
--bg:#f6f7f9;--card:#fff;--card2:#f7f9fc;--ink:#0f172a;--mute:#64748b;--line:#e4e9f1;
--brand:#0d9488;--brand2:#2dd4bf;--brandink:#fff;
--warn:#b45309;--warnbg:#fef3c7;--danger:#b91c1c;--dangerbg:#fee2e2;--info:#1d4ed8;--infobg:#dbeafe;--ok:#15803d;--okbg:#dcfce7;--gold:#854d0e;--goldbg:#fef9c3;--violet:#6d28d9;--violetbg:#ede9fe;
--sh1:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.05);--sh2:0 2px 6px rgba(15,23,42,.07),0 18px 40px rgba(15,23,42,.12);
--glass:rgba(255,255,255,.78);--overlay:rgba(15,23,42,.5);--tint:rgba(13,148,136,.06)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased}
input,select,textarea{background:var(--card);color:var(--ink);font:inherit}
::selection{background:var(--brand2);color:#04211d}
/* sidebar */
aside{width:248px;background:#fff;color:#475569;padding:20px 14px 16px;flex-shrink:0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 22px}
.mark{width:40px;height:40px;flex-shrink:0;filter:drop-shadow(0 6px 16px rgba(13,148,136,.45))}
.brand b{display:block;color:var(--ink);font-size:15px;line-height:1.25;letter-spacing:-.01em}
.brand small{color:var(--mute);font-size:11.5px}
aside a.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:inherit;text-decoration:none;margin-bottom:3px;white-space:nowrap;position:relative;transition:background .2s,color .2s,transform .2s;font-weight:500}
aside a.nav svg{width:19px;height:19px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
aside a.nav:hover{background:#f1f5f9;color:var(--ink)}
aside a.nav.on{background:#f0fdfa;color:#0f766e;font-weight:600;box-shadow:0 0 0 1px rgba(13,148,136,.18),0 6px 20px -6px rgba(13,148,136,.45)}
aside a.nav.on svg{opacity:1;stroke:#0d9488}
aside a.nav.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#0d9488;box-shadow:0 0 12px 1px rgba(13,148,136,.7)}
aside a.nav .badge{margin-left:auto}
aside .foot{margin-top:auto;padding:12px 10px 4px;font-size:12px;color:var(--mute);display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line)}
aside .foot a{color:var(--ink);text-decoration:none;padding:4px 10px;border-radius:8px;border:1px solid var(--line);transition:background .2s}
aside .foot a:hover{background:#f1f5f9}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-right:7px}
.sync i.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25);animation:pulse 2.2s ease-in-out infinite}
.badge{background:var(--danger);color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;padding:1px 8px;margin-left:8px;letter-spacing:.02em}
.badge.live{background:#16a34a;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
/* page */
main{flex:1;padding:30px 34px 70px;min-width:0;max-width:1500px}
h1{font-size:27px;font-weight:800;letter-spacing:-.025em;margin:0 0 4px}
h2{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 24px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px;margin-bottom:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{grid-template-columns:1.2fr 1fr}
.half{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0;box-shadow:var(--sh1);transition:box-shadow .25s,transform .25s,border-color .25s}
a.card:hover,.kpi:hover{box-shadow:0 0 0 1px rgba(13,148,136,.22),0 16px 40px -12px rgba(13,148,136,.35);transform:translateY(-3px)}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand2));box-shadow:0 0 14px rgba(13,148,136,.6)}
.kpi .l{color:var(--mute);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .v.sm{font-size:20px}
.kpi .h{font-size:12.5px;color:var(--mute);margin-top:2px}
.kpi.gold{box-shadow:0 10px 30px -12px rgba(234,179,8,.45);background:linear-gradient(135deg,var(--goldbg),var(--card) 70%);border-color:rgba(234,179,8,.4)}
.kpi.gold::before{background:linear-gradient(90deg,#f59e0b,#fde047)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;color:var(--mute);font-weight:600;background:var(--card2);text-transform:uppercase;letter-spacing:.05em}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover td{background:var(--card2)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:linear-gradient(135deg,var(--brand),#0f766e);color:#fff;border-radius:11px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;box-shadow:0 1px 2px rgba(13,148,136,.25),0 6px 18px -6px rgba(13,148,136,.55);transition:transform .15s,box-shadow .2s,filter .2s,background .2s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 0 0 3px rgba(13,148,136,.12),0 10px 26px -6px rgba(13,148,136,.65)}
.btn:active{transform:translateY(0) scale(.97)}
.btn:disabled{opacity:.5;cursor:wait;transform:none}
.btn.ghost{background:var(--card);color:var(--brand);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--brand);background:var(--tint);box-shadow:none}
.btn.sm{padding:4px 10px;font-size:12px;font-weight:600;border-radius:9px}
.btn.red{background:var(--card);color:var(--danger);border-color:rgba(239,68,68,.35);box-shadow:none}
.btn.red:hover{background:var(--dangerbg);border-color:var(--danger)}
.btn.big{font-size:17px;padding:14px 22px;border-radius:14px}
.btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.p-new{background:var(--infobg);color:var(--info)}.p-packed{background:var(--warnbg);color:var(--warn)}
.p-dispatched{background:var(--violetbg);color:var(--violet)}.p-delivered{background:var(--okbg);color:var(--ok)}
.p-cancelled{background:var(--card2);color:var(--mute)}.p-received{background:var(--warnbg);color:var(--warn)}.p-sorted{background:var(--okbg);color:var(--ok)}
.p-sorting{background:var(--violetbg);color:var(--violet)}
.alert{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:13px;margin-bottom:9px;text-decoration:none;color:var(--ink);transition:transform .18s,box-shadow .18s}
a.alert:hover{transform:translateX(3px);box-shadow:var(--sh1)}
.alert b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.a-danger{background:var(--dangerbg)}.a-danger b{color:var(--danger)}
.a-warn{background:var(--warnbg)}.a-warn b{color:var(--warn)}
.a-info{background:var(--infobg)}.a-info b{color:var(--info)}
.a-gold{background:var(--goldbg)}.a-gold b{color:var(--gold)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0}
.a-danger .dot{background:var(--danger)}.a-warn .dot{background:var(--warn)}.a-info .dot{background:var(--info)}.a-gold .dot{background:#ca8a04}
.pipe{display:flex;gap:16px;overflow-x:auto;padding:2px 4px 6px}
.pipe a{flex:1;min-width:130px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);position:relative;transition:transform .2s,box-shadow .2s,border-color .2s}
.pipe a:hover{transform:translateY(-3px);box-shadow:0 0 0 1px rgba(13,148,136,.2),0 12px 28px -10px rgba(13,148,136,.45);border-color:var(--brand)}
.pipe a:not(:last-child)::after{content:"›";position:absolute;right:-13px;top:50%;transform:translateY(-52%);color:var(--mute);font-size:20px;font-weight:300}
.pipe a .v{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.pipe a .l{font-size:12px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
.bars div{flex:1;background:linear-gradient(180deg,var(--brand2),var(--brand));border-radius:6px 6px 2px 2px;min-height:3px;position:relative;transform-origin:bottom;transition:filter .2s}
.bars div:hover{filter:brightness(1.15)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:5px}
.meter{height:7px;background:var(--line);border-radius:4px;width:90px;display:inline-block;vertical-align:middle;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:4px}
.low{color:var(--danger);font-weight:700}
.up{color:var(--ok);font-weight:600}.down{color:var(--danger);font-weight:600}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.tabs a{padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:13px;font-weight:500;transition:all .18s}
.tabs a:hover{border-color:var(--brand);transform:translateY(-1px)}
.tabs a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sortgrid input{width:84px;padding:7px;border:1px solid var(--line);border-radius:9px;font:inherit;text-align:right}
.muted{color:var(--mute)}
.empty{padding:40px 30px;text-align:center;color:var(--mute)}
details summary{cursor:pointer}
details[open] summary{margin-bottom:12px}
.liverow{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;margin:6px 0 14px}
.liverow label{font-size:12px;font-weight:600;color:var(--mute)}
.liverow select{display:block;margin-top:4px;padding:9px 12px;border:2px solid var(--brand);border-radius:10px;font:inherit;font-size:16px;font-weight:700;min-width:200px}
/* sorting counters */
.counters{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.gbtn{border:0;border-radius:18px;padding:18px 10px;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;position:relative;overflow:hidden;transition:transform .12s,box-shadow .2s}
.gbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);pointer-events:none}
.gbtn:hover{transform:translateY(-3px);box-shadow:0 16px 34px -10px rgba(var(--glow,15,23,42),.65)}
.gbtn:active{transform:scale(.95)}
.gbtn span{font-size:13px;font-weight:600;opacity:.92}
.gbtn b{font-size:42px;line-height:1.1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gbtn b.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.gbtn small{font-size:11px;opacity:.85}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.g-A{--glow:34,197,94;background:linear-gradient(145deg,#22c55e,#15803d);box-shadow:0 12px 24px -12px #15803d}
.g-B{--glow:59,130,246;background:linear-gradient(145deg,#3b82f6,#1d4ed8);box-shadow:0 12px 24px -12px #1d4ed8}
.g-C{--glow:245,158,11;background:linear-gradient(145deg,#f59e0b,#b45309);box-shadow:0 12px 24px -12px #b45309}
.g-Reject{--glow:100,116,139;background:linear-gradient(145deg,#94a3b8,#64748b);box-shadow:0 12px 24px -12px #64748b}
.undo{background:linear-gradient(145deg,#1e293b,#0b1220);box-shadow:0 12px 24px -12px #0b1220}
.g{display:inline-block;min-width:26px;text-align:center;border-radius:7px;color:#fff;font-weight:700;padding:1px 7px;font-size:12px;box-shadow:none}
.brandmode{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brandmode:not(.on){display:block}
.brandmode.on{border:2px solid var(--brand);background:var(--tint)}
/* chat */
.chat{display:flex;flex-direction:column;gap:11px;max-height:58vh;overflow-y:auto;padding:4px 2px 12px}
.msg{max-width:86%;padding:11px 15px;border-radius:16px;line-height:1.55;animation:rise .4s both}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--brand),#0f766e);color:#fff;border-bottom-right-radius:5px}
.msg.ai{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.err{align-self:flex-start;background:var(--dangerbg);color:var(--danger);font-weight:600}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}.msg ul{margin:0 0 8px;padding-left:20px}.msg h3{font-size:14px;margin:8px 0 4px}
.msg .tbl{margin:6px 0}.msg table{font-size:13px}
.msg.think{color:var(--mute);font-style:italic;animation:rise .4s both,breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.55}}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.askrow{display:flex;gap:8px;margin-top:8px}
.askrow input{flex:1;padding:12px 16px;border:2px solid var(--line);border-radius:14px;font:inherit;font-size:15px;transition:border-color .2s,box-shadow .2s}
.askrow input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--tint)}
.flash{animation:flash .8s}
@keyframes flash{from{background:rgba(250,204,21,.35)}to{background:transparent}}
.brandbtns{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 14px}
.bigpiece{font-size:15px;margin:0}
/* lock + splash */
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.28;pointer-events:none}
.o1{width:460px;height:460px;background:#0d9488;left:-120px;top:-140px;animation:float 9s ease-in-out infinite}
.o2{width:420px;height:420px;background:#60a5fa;right:-100px;bottom:-140px;opacity:.4;animation:float 11s ease-in-out infinite reverse}
.o3{width:280px;height:280px;background:#06b6d4;right:22%;top:12%;opacity:.25;animation:float 13s ease-in-out infinite}
@keyframes float{50%{transform:translate(40px,30px) scale(1.08)}}
#lock,#splash{position:fixed;inset:0;background:#f6f7f9;display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
#lock{z-index:50}
#lock[hidden],#splash[hidden]{display:none}
#lock form{position:relative;background:#fff;border:1px solid rgba(13,148,136,.18);border-radius:24px;padding:34px 30px 30px;width:100%;max-width:380px;text-align:center;color:var(--ink);box-shadow:0 0 0 6px rgba(13,148,136,.05),0 24px 70px -20px rgba(13,148,136,.4);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
#lock .mark{width:64px;height:64px;margin-bottom:6px}
#lock h1{font-size:23px;margin:6px 0 2px;color:var(--ink)}
#lock .muted{color:var(--mute);margin:0}
#lock input{width:100%;padding:13px 14px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;font:inherit;font-size:16px;margin:20px 0 12px;text-align:center;letter-spacing:.15em;transition:border-color .2s,box-shadow .2s}
#lock input::placeholder{color:#94a3b8;letter-spacing:normal}
#lock input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px var(--tint)}
#lock .btn{width:100%;justify-content:center;padding:12px;font-size:15px}
#lock .err{color:var(--danger);font-weight:600;min-height:20px;margin-top:12px}
#lock form.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#splash{z-index:80;transition:opacity .7s ease,transform .7s ease,filter .7s ease;cursor:pointer}
#splash.out{opacity:0;transform:scale(1.04);filter:blur(4px);pointer-events:none}
.sp-inner{position:relative;text-align:center;color:var(--ink);transition:transform .7s cubic-bezier(.5,0,.7,.4)}
#splash.out .sp-inner{transform:scale(.92)}
.sp-logo{position:relative;display:inline-block}
.sp-halo{position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(closest-side,rgba(13,148,136,.32),transparent);animation:halo 2.4s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.18);opacity:.55}}
.sp-spark{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 10px 2px rgba(45,212,191,.9);opacity:0;animation:spark 1.1s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(.55s + var(--k)*.03s)}
@keyframes spark{0%{opacity:0;transform:rotate(var(--a)) translateX(0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(92px) scale(1)}}
.sp-name{font-size:40px;font-weight:800;letter-spacing:.34em;margin:18px 0 0 .34em;color:var(--ink);text-shadow:0 0 22px rgba(13,148,136,.28)}
.sp-name span{display:inline-block;opacity:0;animation:letter .7s cubic-bezier(.2,1.6,.4,1) both;animation-delay:calc(.5s + var(--k)*.08s)}
@keyframes letter{from{opacity:0;transform:translateY(-30px) scale(.5);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
.sp-tag{color:var(--mute);letter-spacing:.22em;text-transform:uppercase;font-size:11.5px;font-weight:600;margin-top:4px;animation:rise .7s .95s both}
.sp-stage{position:relative;width:340px;height:156px;margin:16px auto 0}
.sp-bin{position:absolute;bottom:0;left:calc(50% - 40px + var(--dx));width:80px;height:56px;border-radius:14px;background:#fff;border:1.5px solid rgba(var(--c),.35);box-shadow:0 10px 26px -10px rgba(var(--c),.6);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:rise .6s both;animation-delay:calc(.9s + var(--k)*.08s)}
.sp-bin b{font-size:21px;line-height:1.1;font-weight:800;color:rgb(var(--c));font-variant-numeric:tabular-nums}
.sp-bin small{font-size:9.5px;letter-spacing:.14em;color:var(--mute);font-weight:700}
.sp-bin.hit{animation:binhit .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes binhit{40%{transform:scale(1.12);box-shadow:0 0 0 7px rgba(var(--c),.14),0 12px 34px -6px rgba(var(--c),.85)}}
.sp-item{position:absolute;left:calc(50% - 17px);top:0;width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,rgba(var(--c),1),rgba(var(--c),.72));box-shadow:0 8px 18px -6px rgba(var(--c),.9);display:grid;place-items:center;opacity:0;animation:drop .85s cubic-bezier(.45,0,.6,1) both;animation-delay:var(--d)}
.sp-item svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
@keyframes drop{0%{opacity:0;transform:translate(0,-26px) scale(.5) rotate(0)}18%{opacity:1;transform:translate(0,4px) scale(1.05) rotate(calc(var(--r)*.3))}82%{opacity:1;transform:translate(var(--dx),92px) scale(.9) rotate(var(--r))}100%{opacity:0;transform:translate(var(--dx),112px) scale(.3) rotate(var(--r))}}
.sp-stats{display:flex;gap:30px;justify-content:center;margin-top:24px;min-height:48px}
.sp-stat{animation:rise .55s both;animation-delay:calc(var(--k)*.09s)}
.sp-stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sp-stat span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.09em;font-weight:600}
.sp-bar{width:220px;height:3px;background:var(--line);border-radius:3px;margin:22px auto 10px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#0d9488,#2dd4bf);box-shadow:0 0 12px 1px rgba(13,148,136,.8);border-radius:3px;animation:fill 3.3s .2s cubic-bezier(.4,0,.2,1) forwards}
.sp-hint{color:var(--mute);font-size:13px;animation:rise .6s .6s both}
.sp-ring{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;border:2px solid rgba(13,148,136,.55);box-shadow:0 0 34px rgba(13,148,136,.55),inset 0 0 20px rgba(13,148,136,.3);opacity:0;pointer-events:none}
#splash.out .sp-ring{animation:ring .75s ease-out both}
@keyframes ring{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(26)}}
@media(max-width:420px){.sp-stage{transform:scale(.85)}.sp-name{font-size:32px}.sp-stats{gap:18px}}
.sp-mark{width:104px;height:104px;filter:drop-shadow(0 14px 34px rgba(13,148,136,.55));animation:popin .9s cubic-bezier(.2,1.4,.4,1) both}
.sp-mark .hang{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.25s .35s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes popin{from{opacity:0;transform:scale(.4) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}
/* modal + toast + topbar */
#modal{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:10;overflow:auto;animation:fade .2s both}
#modal[hidden]{display:none}
#modal form{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;width:100%;max-width:580px;box-shadow:var(--sh2);animation:modalin .3s cubic-bezier(.2,1,.3,1) both}
@keyframes modalin{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
#modal label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:10px}
#modal input,#modal select{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;font:inherit;color:var(--ink);transition:border-color .2s,box-shadow .2s}
#modal input:focus,#modal select:focus,.set input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(13,148,136,.14),0 0 18px -4px rgba(13,148,136,.5)}
#modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal .line{display:grid;grid-template-columns:1fr 80px 90px 30px;gap:6px;margin-bottom:6px}
#modal .line input,#modal .line select{margin:0}
#modal .x{border:0;background:var(--dangerbg);color:var(--danger);border-radius:8px;cursor:pointer}
#modal .foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
#modal .err{color:var(--danger);font-weight:600}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;transition:.3s cubic-bezier(.2,1,.3,1);pointer-events:none;z-index:90;max-width:90vw;box-shadow:0 14px 30px -10px rgba(15,23,42,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#topbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;background:linear-gradient(90deg,transparent,#0d9488,transparent) no-repeat;background-size:40% 100%;animation:sweep 1.1s linear infinite}
#topbar.on{opacity:1;filter:drop-shadow(0 0 6px rgba(13,148,136,.8))}
@keyframes sweep{from{background-position:-40% 0}to{background-position:140% 0}}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.set label{font-size:12px;font-weight:600;color:var(--mute)}
.set input{display:block;width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;font:inherit;transition:border-color .2s,box-shadow .2s}
code{background:var(--card2);border:1px solid var(--line);padding:2px 6px;border-radius:6px;font-size:12.5px;word-break:break-all}
/* entrance animation */
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.bars.rise div{animation:grow .8s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--j,0)*40ms + .3s)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media(max-width:860px){
  body{flex-direction:column}
  aside{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;gap:4px;border-right:0}
  .brand{display:none}
  aside a.nav.on::before{display:none}
  aside a.nav{margin:0}
  aside .foot{margin:0;border:0;padding:0 6px;white-space:nowrap}
  .two,.half{grid-template-columns:1fr}
  .counters{grid-template-columns:repeat(3,1fr)}
  main{padding:18px 16px 60px}
  h1{font-size:23px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
@media print{aside,.btn,#topbar{display:none}}
</style>
</head>
<body>
<div id="topbar"></div>
<div id="splash" hidden></div>
<aside id="nav"></aside>
<main id="app"></main>
<div id="modal" hidden></div>
<div id="lock" hidden><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <form id="lockForm">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="mgl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0e7490"/></linearGradient></defs><rect width="64" height="64" rx="17" fill="url(#mgl)"/><path class="hang" pathLength="1" d="M26 22a6 6 0 1 1 7.2 5.9c-1 .2-1.2.8-1.2 1.7V32M32 32 14 44h36Z" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Landa Dashboard</h1>
    <p class="muted">Enter your password to continue</p>
    <input type="password" name="pw" autocomplete="current-password" placeholder="Password" required>
    <button class="btn">Unlock</button>
    <div class="err" id="lockErr"></div>
  </form>
</div>
<div id="toast"></div>
<script>
/* ---------- connection ---------- */
const SUPA_URL = 'https://ajevxwdgmpaakjkffvmf.supabase.co';
// Public "anon" key — safe to ship. Every table is locked behind the
// dashboard password by row level security (see supabase/setup.sql).
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqZXZ4d2RnbXBhYWtqa2Zmdm1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUwNjE5NzIsImV4cCI6MjEwMDYzNzk3Mn0.bB97bHOFgCeMUTYUraOArzvXAkFRHxiajrCg3gwCGrc';
const T = name => 'landa_clothing_wholesale_business_' + name;
const TOKEN_KEY = 'landa-dashboard-session';

/* ---------- basics ---------- */
const GRADES = ['A', 'B', 'C', 'Reject'];
const FLOW = ['new', 'packed', 'dispatched', 'delivered'];
const LABEL = {new:'New', packed:'Packed', dispatched:'Dispatched', delivered:'Delivered', cancelled:'Cancelled', received:'Waiting to sort', sorting:'Sorting now', sorted:'Sorted'};
const COURIERS = ['TCS', 'Leopards', 'M&P', 'Daewoo Cargo', 'Own vehicle', 'Other'];

const $ = s => document.querySelector(s);
const iso = d => d.toLocaleDateString('en-CA');
const today = () => iso(new Date());
const ago = n => iso(new Date(Date.now() - n * 864e5));
const age = d => Math.round((new Date(today()) - new Date(d)) / 864e5);
const rs = n => 'Rs ' + Math.round(n || 0).toLocaleString('en-PK');
const num = n => Math.round(n || 0).toLocaleString('en-PK');
const sum = (arr, f) => arr.reduce((s, x) => s + (f(x) || 0), 0);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = k => k.replace('|', ' · ');
const pill = s => `<span class="pill p-${s}">${LABEL[s]}</span>`;
const clock = ts => new Date(ts).toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit', second: '2-digit'});
const since = ts => { const s = (Date.now() - new Date(ts)) / 1000; return s < 60 ? Math.max(0, Math.round(s)) + 's ago' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : iso(new Date(ts)); };
const route = () => (location.hash.slice(1) || 'dashboard').split('/');
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms); }
let actx;
function beep() { try { actx = actx || new AudioContext(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.value = .08; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .09); } catch (e) {} }

let S = null;
const ZERO = {qty: 0, price: 0, min: 0};
const ST = k => S.stock[k] || ZERO;
const cust = id => S.customers.find(c => c.id === id) || {name: '(deleted)', city: '', phone: ''};
const total = o => sum(o.lines, l => l.qty * l.price);
const due = o => o.status === 'cancelled' ? 0 : total(o) - (o.paid || 0);
const custDue = id => sum(S.orders.filter(o => o.customerId === id), due);
const live = o => o.status !== 'cancelled';

/* ---------- database ---------- */
let sb, token = sessionStorage.getItem(TOKEN_KEY), channel = null, liveOK = false;
function makeClient() {
  sb = supabase.createClient(SUPA_URL, SUPA_KEY, {
    auth: {persistSession: false, autoRefreshToken: false, detectSessionInUrl: false},
    global: {headers: token ? {'x-landa-session': token} : {}},
  });
}
async function rpc(name, args = {}) {
  busy(1); const {data, error} = await sb.rpc(T(name), args).finally(() => busy(0));
  if (error) { if (/Locked/.test(error.message)) showLock('Session expired — log in again'); throw new Error(error.message); }
  return data;
}
async function q(query) { busy(1); const {data, error} = await Promise.resolve(query).finally(() => busy(0)); if (error) throw new Error(error.message); return data; }
async function all(build) {
  let out = [];
  for (let from = 0; ; from += 1000) {
    const d = await q(build().range(from, from + 999));
    out = out.concat(d);
    if (d.length < 1000) return out;
  }
}
const tb = n => sb.from(T(n));

async function loadAll() {
  const [set, cats, stock, bales, yields, custs, orders, lines, log, liveRow, brands, devices, pending] = await Promise.all([
    q(tb('settings').select('*').eq('id', 1).maybeSingle()),
    q(tb('categories').select('name').order('sort_order').order('name')),
    all(() => tb('stock_items').select('*').order('category')),
    all(() => tb('bales_received').select('*').order('created_at', {ascending: false})),
    all(() => tb('bale_yield_totals').select('*').order('bale_id')),
    all(() => tb('wholesale_customers').select('*').order('name')),
    all(() => tb('customer_orders').select('*').order('created_at', {ascending: false})),
    all(() => tb('customer_order_lines').select('order_id,category,grade,qty,price').order('id')),
    q(tb('activity_log').select('happened_on,message').order('id', {ascending: false}).limit(200)),
    q(tb('live_sorting_session').select('*').eq('id', 1).maybeSingle()),
    q(tb('brand_piece_counts').select('*').order('pieces', {ascending: false}).limit(300)),
    q(tb('sensor_devices').select('id,name,last_seen').order('id')),
    q(tb('sorted_pieces').select('id,bale_id,category,grade,brand,source,created_at').or('brand.is.null,category.is.null').neq('source', 'bulk').order('id').limit(50)),
  ]);
  if (!set) { showLock('Session expired — log in again'); throw new Error('Locked'); }
  const recent = liveRow?.bale_id
    ? await q(tb('sorted_pieces').select('id,bale_id,category,grade,brand,source,created_at').eq('bale_id', liveRow.bale_id).neq('source', 'bulk').order('id', {ascending: false}).limit(15))
    : [];
  const byBale = {}, byOrder = {};
  S = {
    settings: {bizName: set.biz_name, alertEmail: set.alert_email, sortDays: set.sort_days, dispatchDays: set.dispatch_days,
      dueDays: set.due_days, runoutDays: set.runout_days, deadDays: set.dead_days, lockoutSeconds: set.sensor_lockout_seconds,
      brandList: set.brand_list || [], brandsReady: 'brand_list' in set, emailUrl: set.email_webapp_url || '', dailyDigest: set.email_daily_digest !== false, instantAlerts: set.email_instant_alerts !== false,
      robotAt: set.email_robot_connected_at || null, emailReady: 'email_webapp_url' in set},
    categories: cats.map(c => c.name),
    stock: Object.fromEntries(stock.map(s => [s.category + '|' + s.grade, {qty: s.qty, price: +s.price, min: s.min_qty}])),
    bales: bales.map(b => byBale[b.id] = {id: b.id, date: b.received_date, supplier: b.supplier, type: b.bale_type,
      weightKg: +b.weight_kg, cost: +b.cost, status: b.status, sortedDate: b.sorted_date, yield: {}}),
    customers: custs.map(c => ({id: c.id, name: c.name, city: c.city, phone: c.phone, limit: +c.credit_limit})),
    orders: orders.map(o => byOrder[o.id] = {id: o.id, date: o.order_date, customerId: o.customer_id, status: o.status, paid: +o.paid,
      courier: o.courier, tracking: o.tracking, history: o.history || [], lines: []}),
    log: log.map(l => ({d: l.happened_on, t: l.message})),
    live: {baleId: liveRow?.bale_id || null, category: liveRow?.category || null, brand: liveRow?.brand || null, brandReady: !!liveRow && 'brand' in liveRow},
    brands, devices, pending, recent,
  };
  yields.forEach(y => { if (byBale[y.bale_id]) byBale[y.bale_id].yield[y.category + '|' + y.grade] = y.qty; });
  lines.forEach(l => { if (byOrder[l.order_id]) byOrder[l.order_id].lines.push({key: l.category + '|' + l.grade, qty: l.qty, price: +l.price}); });
}

let refreshing = null, again = false, lastPieceId = null;
function refresh() {
  if (refreshing) { again = true; return refreshing; }
  refreshing = (async () => {
    try {
      do { again = false; await loadAll(); } while (again);
      const top = S.recent[0]?.id || 0;
      if (lastPieceId !== null && top > lastPieceId && route()[0] === 'sorting') beep();
      lastPieceId = top;
      render(true);
    } catch (e) { if (e.message !== 'Locked') toast(e.message); }
    finally { refreshing = null; }
  })();
  return refreshing;
}
function subscribe() {
  if (channel) sb.removeChannel(channel);
  let t;
  channel = sb.channel('landa-sync-' + Math.random().toString(36).slice(2))
    .on('postgres_changes', {event: '*', schema: 'public', table: T('sync_pings')}, () => { clearTimeout(t); t = setTimeout(refresh, 120); })
    .subscribe(status => { const was = liveOK; liveOK = status === 'SUBSCRIBED'; drawNav(); if (liveOK && !was) refresh(); });
}

/* ---------- login ---------- */
function showLock(msg) {
  $('#lock').hidden = false;
  $('#lockErr').textContent = msg || '';
  setTimeout(() => $('#lock input').focus(), 50);
}
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, btn = f.querySelector('.btn');
  btn.disabled = true; $('#lockErr').textContent = '';
  token = null; makeClient();
  const {data, error} = await sb.rpc(T('unlock_dashboard'), {p_password: f.pw.value, p_device: navigator.userAgent});
  btn.disabled = false;
  if (error) { f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); $('#lockErr').textContent = /schema cache|does not exist/.test(error.message) ? 'Database is not set up yet' : error.message; f.pw.select(); return; }
  token = data; sessionStorage.setItem(TOKEN_KEY, token); f.reset();
  start();
});
async function start() {
  makeClient();
  if (!token) return showLock();
  $('#lock').hidden = true;
  const work = (async () => {
    const {data, error} = await sb.rpc(T('session_is_valid'));
    if (error) { showLock(/schema cache|does not exist/.test(error.message) ? 'Database is not set up yet — run supabase/setup.sql' : 'Cannot reach the database: ' + error.message); return false; }
    if (!data) { sessionStorage.removeItem(TOKEN_KEY); token = null; makeClient(); showLock(); return false; }
    try { await loadAll(); return true; } catch (e) { return false; }
  })();
  if (!(await playSplash(work))) return;
  $('#lock').hidden = true;
  lastPieceId = S.recent[0]?.id || 0;
  render();
  subscribe();
}

/* ---------- analytics ---------- */
function velocity(days = 14) {
  const v = {};
  S.orders.filter(o => live(o) && age(o.date) < days).forEach(o => o.lines.forEach(l => v[l.key] = (v[l.key] || 0) + l.qty));
  return v;
}
function salesAgg(fromAge, toAge) {
  const m = {};
  S.orders.filter(o => live(o) && age(o.date) >= fromAge && age(o.date) < toAge).forEach(o => o.lines.forEach(l => {
    const r = m[l.key] || (m[l.key] = {key: l.key, pcs: 0, rev: 0, orders: 0, custs: new Set()});
    r.pcs += l.qty; r.rev += l.qty * l.price; r.orders++; r.custs.add(o.customerId);
  }));
  return m;
}
function bestSeller(days = 30) { return Object.values(salesAgg(0, days)).sort((a, b) => b.pcs - a.pcs)[0]; }
function supplierForCategory(cat) {
  const m = {};
  S.bales.filter(b => b.status !== 'received').forEach(b => GRADES.forEach(g => {
    const q = b.yield[cat + '|' + g]; if (!q) return;
    const s = m[b.supplier] || (m[b.supplier] = {name: b.supplier, pcs: 0, a: 0});
    s.pcs += q; if (g === 'A') s.a += q;
  }));
  return Object.values(m).filter(s => s.pcs >= 20).sort((x, y) => y.a / y.pcs - x.a / x.pcs)[0];
}
function alerts() {
  const A = [], st = S.settings, v = velocity(), push = (lvl, type, text, go) => A.push({lvl, type, text, go});
  Object.entries(S.stock).forEach(([k, s]) => {
    if (s.min > 0 && s.qty <= s.min) push(s.qty <= 0 ? 'danger' : 'warn', 'Low stock', `${label(k)} is down to ${num(s.qty)} pcs (minimum ${s.min})`, '#inventory');
    else if (v[k] && s.qty > 0) {
      const cover = s.qty / (v[k] / 14);
      if (cover <= st.runoutDays) push('info', 'Selling fast', `${label(k)} will run out in ~${Math.max(1, Math.round(cover))} days at current pace (${v[k]} sold in 14 days)`, '#inventory');
    }
  });
  S.bales.filter(b => b.status !== 'sorted' && age(b.date) >= st.sortDays)
    .forEach(b => push('warn', 'Sorting delay', `Bale ${b.id} (${b.type}, ${b.weightKg} kg) arrived ${age(b.date)} days ago and is still ${b.status === 'sorting' ? 'being sorted' : 'not sorted'} — ${rs(b.cost)} of cash sitting idle`, '#sorting/' + b.id));
  S.orders.filter(o => (o.status === 'new' || o.status === 'packed') && age(o.date) >= st.dispatchDays)
    .forEach(o => push('warn', 'Dispatch late', `${o.id} for ${cust(o.customerId).name} is ${LABEL[o.status].toLowerCase()} but not sent — ${age(o.date)} days old`, '#orders'));
  S.orders.filter(o => due(o) > 0 && age(o.date) >= st.dueDays)
    .forEach(o => push('danger', 'Payment overdue', `${cust(o.customerId).name} owes ${rs(due(o))} on ${o.id} (${age(o.date)} days)`, '#orders'));
  S.customers.forEach(c => { const d = custDue(c.id); if (c.limit && d > c.limit) push('danger', 'Credit limit', `${c.name} owes ${rs(d)} — over their ${rs(c.limit)} limit. Hold new orders until paid.`, '#customers'); });
  const moving = velocity(st.deadDays);
  const dead = Object.entries(S.stock).filter(([k, s]) => s.qty >= 150 && !moving[k]);
  if (dead.length) push('info', 'Not moving', `${dead.length} items have 150+ pcs and no sales in ${st.deadDays} days: ${dead.slice(0, 5).map(([k, s]) => `${label(k)} (${num(s.qty)})`).join(', ')}${dead.length > 5 ? '…' : ''}. Consider a bundle deal.`, '#inventory');
  const rank = {danger: 0, warn: 1, info: 2};
  return A.sort((a, b) => rank[a.lvl] - rank[b.lvl]);
}
function supplierStats() {
  const m = {};
  S.bales.forEach(b => {
    const s = m[b.supplier] || (m[b.supplier] = {name: b.supplier, bales: 0, sorted: 0, kg: 0, cost: 0, pcs: 0, a: 0, rej: 0});
    s.bales++;
    if (b.status !== 'sorted') return;
    s.sorted++; s.kg += b.weightKg; s.cost += b.cost;
    Object.entries(b.yield).forEach(([k, q]) => { s.pcs += q; const g = k.split('|')[1]; if (g === 'A') s.a += q; if (g === 'Reject') s.rej += q; });
  });
  return Object.values(m).sort((x, y) => (y.pcs ? y.a / y.pcs : 0) - (x.pcs ? x.a / x.pcs : 0));
}

/* ---------- nav ---------- */
const NAV = [['dashboard', 'Dashboard'], ['insights', 'Best sellers'], ['ask', 'Ask AI'], ['bales', 'Bales in'], ['sorting', 'Sorting'], ['inventory', 'Inventory'], ['orders', 'Orders'], ['customers', 'Wholesalers'], ['alerts', 'Alerts'], ['settings', 'Settings']];

/* ---------- motion ---------- */
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let inflight = 0;
const busy = on => { inflight = Math.max(0, inflight + (on ? 1 : -1)); $('#topbar')?.classList.toggle('on', inflight > 0); };
function countUp(root) {
  if (reduceMotion) return;
  root.querySelectorAll('.kpi .v, .pipe .v').forEach(el => {
    const m = el.textContent.match(/^(Rs\s)?([\d,]+)(.*)$/s);
    if (!m) return;
    const target = +m[2].replace(/,/g, ''); if (!target) return;
    const t0 = performance.now(), dur = 900;
    const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      el.textContent = (m[1] || '') + Math.round(target * e).toLocaleString('en-PK') + m[3];
      if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function entrance(root) {
  if (reduceMotion) return;
  [...root.querySelectorAll(':scope > .head, :scope > .tabs, :scope > .card, :scope > .grid > *, :scope > details')].forEach((el, i) => { el.classList.add('rise'); el.style.setProperty('--i', Math.min(i, 12)); });
  root.querySelectorAll('.bars').forEach(b => { b.classList.add('rise'); [...b.children].forEach((d, j) => d.style.setProperty('--j', j)); });
  countUp(root);
}
const greet = () => { const h = new Date().getHours(); return h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };
// Plays every time the app opens (new tab, reopen, reload) and after every login.
// Runs while the data loads, so it costs no extra waiting. Tap to skip.
const SP_ICONS = {
  tee: '<path d="M8 4 4 7l2 3h2v10h8V10h2l2-3-4-3-2 2h-4z"/>',
  jeans: '<path d="M7 3h10l1 18h-4.5L12 11l-1.5 10H6z"/><path d="M7 7h10"/>',
  jacket: '<path d="M9 3 5 5v16h5v-7h4v7h5V5l-4-2-3 4z"/><path d="M12 7v7"/>',
  dress: '<path d="M10 3h4l-.5 4 4.5 14H6l4.5-14z"/>',
};
const SP_BINS = [['A', '34,197,94', -112], ['B', '59,130,246', 0], ['C', '245,158,11', 112]];
function splashMarkup() {
  const drops = [['tee', 0], ['jeans', 1], ['jacket', 0], ['dress', 2], ['tee', 1], ['jeans', 0], ['jacket', 2], ['dress', 1], ['tee', 0]];
  const sparks = [...Array(12)].map((_, k) => `<i class="sp-spark" style="--k:${k};--a:${k * 30}deg"></i>`).join('');
  return `<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="sp-ring"></div>
  <div class="sp-inner">
    <div class="sp-logo"><div class="sp-halo"></div>${sparks}${MARK.replace('class="mark"', 'class="sp-mark"')}</div>
    <div class="sp-name">${[...'LANDA'].map((c, k) => `<span style="--k:${k}">${c}</span>`).join('')}</div>
    <div class="sp-tag">Bale · Sort · Sell</div>
    <div class="sp-stage">
      ${SP_BINS.map(([g, c, dx], k) => `<div class="sp-bin" id="spBin${g}" style="--c:${c};--dx:${dx}px;--k:${k}"><b>0</b><small>GRADE ${g}</small></div>`).join('')}
      ${drops.map(([ic, b], n) => `<div class="sp-item" data-bin="${SP_BINS[b][0]}" style="--c:${SP_BINS[b][1]};--dx:${SP_BINS[b][2]}px;--r:${(n % 2 ? 1 : -1) * (40 + n * 17)}deg;--d:${(1.1 + n * .19).toFixed(2)}s"><svg viewBox="0 0 24 24">${SP_ICONS[ic]}</svg></div>`).join('')}
    </div>
    <div class="sp-stats" id="spStats"></div>
    <div class="sp-bar"><i></i></div>
    <div class="sp-hint" id="spHint">${greet()} — getting everything ready…</div>
  </div>`;
}
function splashStats() {
  if (!S) return;
  const month = today().slice(0, 7);
  const stats = [
    [sum(Object.values(S.stock), x => x.qty), 'pcs in stock', ''],
    [sum(S.orders.filter(o => live(o) && o.date.startsWith(month)), total), 'sales this month', 'Rs '],
    [S.orders.filter(o => o.status === 'new' || o.status === 'packed').length, 'orders to send', ''],
  ];
  $('#spStats').innerHTML = stats.map(([v, l, pre], k) => `<div class="sp-stat" style="--k:${k}"><b data-v="${Math.round(v)}" data-pre="${pre}">${pre}0</b><span>${l}</span></div>`).join('');
  $('#spStats').querySelectorAll('b').forEach(el => {
    const target = +el.dataset.v, pre = el.dataset.pre, t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 3);
      el.textContent = pre + Math.round(target * e).toLocaleString('en-PK'); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
    setTimeout(() => { el.textContent = pre + target.toLocaleString('en-PK'); }, 1250);   // in case the tab is in the background
  });
  $('#spHint').textContent = `${greet()} — welcome back to ${S.settings.bizName}`;
}
function playSplash(work) {
  const sp = $('#splash');
  if (reduceMotion) return work;
  sp.innerHTML = splashMarkup();
  sp.classList.remove('out'); sp.hidden = false;
  // each item lands in its box: bump that box's counter with a glow
  sp.querySelectorAll('.sp-item').forEach(it => it.addEventListener('animationend', () => {
    const bin = $('#spBin' + it.dataset.bin), b = bin?.querySelector('b');
    if (!b) return;
    b.textContent = +b.textContent + 1;
    bin.classList.remove('hit'); void bin.offsetWidth; bin.classList.add('hit');
  }));
  const MIN = 3600, t0 = Date.now();
  return new Promise(resolve => {
    let result = null, skipped = false, ended = false;
    const end = ok => {
      if (ended) return; ended = true;
      sp.classList.add('out'); resolve(ok);
      setTimeout(() => { sp.hidden = true; sp.classList.remove('out'); sp.innerHTML = ''; }, 800);
    };
    const check = () => { if (result === null) return; if (!result) return end(false); if (skipped || Date.now() - t0 >= MIN) end(true); };
    work.then(ok => { result = !!ok; if (ok) splashStats(); check(); setTimeout(check, Math.max(0, MIN - (Date.now() - t0))); },
              () => { result = false; check(); });
    sp.onclick = () => { skipped = true; check(); };
  });
}

const PAGES = {};
const AFTER = {};
const head = (t, sub, btns = '') => `<div class="head"><div><h1>${t}</h1><p class="sub">${sub}</p></div><div class="btns">${btns}</div></div>`;

PAGES.dashboard = () => {
  const st = Object.values(S.stock), A = alerts();
  const waiting = S.bales.filter(b => b.status !== 'sorted');
  const month = today().slice(0, 7);
  const mSales = sum(S.orders.filter(o => live(o) && o.date.startsWith(month)), total);
  const mBuy = sum(S.bales.filter(b => b.date.startsWith(month)), b => b.cost);
  const cnt = s => S.orders.filter(o => o.status === s).length;
  const days = [...Array(14)].map((_, i) => ago(13 - i));
  const daily = days.map(d => sum(S.orders.filter(o => live(o) && o.date === d), total));
  const max = Math.max(...daily, 1);
  const v = velocity();

  if (!S.bales.length && !S.orders.length) return head('Dashboard', 'Nothing here yet') +

  <div class="grid kpis">
    <a class="card kpi gold" href="#insights" style="text-decoration:none;color:inherit"><div class="l">🏆 Best seller · 30 days</div><div class="v sm">${bs ? esc(label(bs.key)) : '—'}</div><div class="h">${bs ? `${num(bs.pcs)} pcs · ${rs(bs.rev)}` : 'no sales yet'}</div></a>
    <div class="card kpi"><div class="l">Stock on hand</div><div class="v">${num(sum(st, s => s.qty))} pcs</div><div class="h">worth ${rs(sum(st, s => s.qty * s.price))} at selling price</div></div>
    <div class="card kpi"><div class="l">Sales this month</div><div class="v">${rs(mSales)}</div><div class="h">bales bought this month: ${rs(mBuy)}</div></div>
    <div class="card kpi"><div class="l">Money to collect</div><div class="v">${rs(sum(S.orders, due))}</div><div class="h">from ${S.customers.filter(c => custDue(c.id) > 0).length} wholesalers</div></div>
    <div class="card kpi"><div class="l">Needs attention</div><div class="v" style="color:${A.some(a => a.lvl === 'danger') ? 'var(--danger)' : 'inherit'}">${A.filter(a => a.lvl !== 'info').length}</div><div class="h">alerts + ${A.filter(a => a.lvl === 'info').length} signals</div></div>
  </div>
  <div class="card" style="margin-bottom:14px"><h2>Pipeline</h2><div class="pipe">

    <a href="#inventory"><div class="v">${num(sum(st, s => s.qty))}</div><div class="l">Pieces in stock</div></a>
    <a href="#orders/new"><div class="v">${cnt('new')}</div><div class="l">New orders</div></a>
    <a href="#orders/packed"><div class="v">${cnt('packed')}</div><div class="l">Packed, ready</div></a>
    <a href="#orders/dispatched"><div class="v">${cnt('dispatched')}</div><div class="l">On the road</div></a>
    <a href="#orders/delivered"><div class="v">${cnt('delivered')}</div><div class="l">Delivered</div></a>
  </div></div>
  <div class="grid two">
    <div class="card"><h2>Alerts & signals</h2>${A.slice(0, 6).map(alertHtml).join('') || '<div class="empty">All clear 👌</div>'}
      ${A.length > 6 ? `<a href="#alerts" class="btn ghost sm">See all ${A.length}</a>` : ''}</div>
    <div class="card"><h2>Sales — last 14 days</h2>
      <div class="bars">${daily.map((x, i) => `<div style="height:${x / max * 100}%" title="${days[i]}: ${rs(x)}"></div>`).join('')}</div>
      <div class="axis"><span>${days[0].slice(5)}</span><span>today</span></div>
      <h2 style="margin-top:18px">Fastest movers (14 days)</h2>
      <div class="tbl"><table><tr><th>Item</th><th class="n">Sold</th><th class="n">Left</th><th class="n">Days left</th></tr>
      ${movers.map(([k, q]) => { const left = ST(k).qty, cover = left / (q / 14); return `<tr><td>${esc(label(k))}</td><td class="n">${num(q)}</td><td class="n">${num(left)}</td><td class="n ${cover <= S.settings.runoutDays ? 'low' : ''}">${left <= 0 ? 'OUT' : Math.round(cover)}</td></tr>`; }).join('') || '<tr><td colspan="4" class="muted">No sales in the last 14 days</td></tr>'}
      </table></div></div>

function supplierTable() {
  const rows = supplierStats();
  if (!rows.length) return '<p class="muted">Log and sort some bales to compare suppliers.</p>';
  return `<div class="tbl"><table><tr><th>Supplier</th><th class="n">Bales</th><th class="n">Rs / kg</th><th class="n">Pcs / kg</th><th class="n">Cost / pc</th><th>A-grade share</th><th class="n">Reject</th></tr>
  ${rows.map(s => `<tr><td>${esc(s.name)}</td><td class="n">${s.bales}${s.bales > s.sorted ? ` <span class="muted">(${s.bales - s.sorted} unsorted)</span>` : ''}</td>
    <td class="n">${s.kg ? num(s.cost / s.kg) : '—'}</td><td class="n">${s.kg ? (s.pcs / s.kg).toFixed(1) : '—'}</td><td class="n">${s.pcs ? rs(s.cost / s.pcs) : '—'}</td>
    <td>${s.pcs ? `<span class="meter"><i style="width:${s.a / s.pcs * 100}%"></i></span> ${Math.round(s.a / s.pcs * 100)}%` : '—'}</td>
    <td class="n">${s.pcs ? Math.round(s.rej / s.pcs * 100) + '%' : '—'}</td></tr>`).join('')}</table></div>`;
}

PAGES.insights = arg => {
  const PERIODS = [[7, '7 days'], [30, '30 days'], [90, '90 days'], [365, '1 year'], [0, 'All time']];
  const days = PERIODS.some(p => p[0] === +arg) && arg !== undefined ? +arg : 30;
  const plabel = PERIODS.find(p => p[0] === days)[1];
  const span = days || Math.max(1, ...S.orders.map(o => age(o.date) + 1));
  const cur = salesAgg(0, days || Infinity), prev = days ? salesAgg(days, days * 2) : {};
  const items = Object.values(cur).sort((a, b) => b.pcs - a.pcs);
  const tabs = `<div class="tabs">${PERIODS.map(([d, t]) => `<a href="#insights/${d}" class="${d === days ? 'on' : ''}">${t}</a>`).join('')}</div>`;
  const top = head('Best sellers', 'What sells, what earns, who buys — worked out from every order');
  if (!items.length) return top + tabs + `<div class="card empty">No sales in the last ${plabel.toLowerCase()} yet.</div>`;
  const totPcs = sum(items, r => r.pcs), totRev = sum(items, r => r.rev);
  const best = items[0], earner = [...items].sort((a, b) => b.rev - a.rev)[0];
  const group = (keyFn) => { const m = {}; items.forEach(r => { const k = keyFn(r); const x = m[k] || (m[k] = {name: k, pcs: 0, rev: 0}); x.pcs += r.pcs; x.rev += r.rev; }); return Object.values(m).sort((a, b) => b.rev - a.rev); };
  const cats = group(r => r.key.split('|')[0]), grades = group(r => r.key.split('|')[1]);
  const custs = {}; S.orders.filter(o => live(o) && age(o.date) < (days || Infinity)).forEach(o => { const c = custs[o.customerId] || (custs[o.customerId] = {id: o.customerId, rev: 0, pcs: 0, orders: 0}); c.rev += total(o); c.pcs += sum(o.lines, l => l.qty); c.orders++; });
  const custList = Object.values(custs).sort((a, b) => b.rev - a.rev);
  const trend = r => { if (!days) return ''; const p = prev[r.key]?.pcs || 0; if (!p) return '<span class="up">new</span>'; const d = (r.pcs - p) / p * 100; return `<span class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '↑' : '↓'} ${Math.abs(Math.round(d))}%</span>`; };
  const cover = r => { const left = ST(r.key).qty, rate = r.pcs / span; return left <= 0 ? 0 : rate ? left / rate : Infinity; };

  const sig = [];
  sig.push({lvl: 'gold', type: 'Best seller', text: `${label(best.key)} is your #1 — ${num(best.pcs)} pcs (${Math.round(best.pcs / totPcs * 100)}% of everything sold) for ${rs(best.rev)} in ${plabel.toLowerCase()}.`, go: '#inventory'});
  const bc = cover(best);
  if (bc < S.settings.runoutDays * 2) sig.push({lvl: 'warn', type: 'Restock', text: `${label(best.key)} has ${bc === 0 ? 'run out' : `only ~${Math.round(bc)} days of stock left`} at this pace. Sort more ${best.key.split('|')[0]} bales first — and since it sells anyway, there's room to raise its price a little.`, go: '#sorting'});
  const topCat = cats[0], sup = supplierForCategory(topCat.name);
  sig.push({lvl: 'info', type: 'Top category', text: `${topCat.name} brings in the most money: ${rs(topCat.rev)} (${Math.round(topCat.rev / totRev * 100)}% of sales).${sup ? ` ${sup.name} gives you the most A-grade ${topCat.name} (${Math.round(sup.a / sup.pcs * 100)}% A) — buy ${topCat.name} bales from them.` : ''}`, go: '#bales'});
  if (days) {
    const risers = items.filter(r => (prev[r.key]?.pcs || 0) >= 20).map(r => ({r, d: (r.pcs - prev[r.key].pcs) / prev[r.key].pcs})).sort((a, b) => b.d - a.d);
    if (risers[0] && risers[0].d > .2) sig.push({lvl: 'info', type: 'Rising fast', text: `${label(risers[0].r.key)} sales are up ${Math.round(risers[0].d * 100)}% compared with the ${plabel.toLowerCase()} before.`, go: '#inventory'});
    const fallers = risers.filter(x => x.d < -.3).reverse();
    if (fallers[0]) sig.push({lvl: 'warn', type: 'Slowing down', text: `${label(fallers[0].r.key)} sales dropped ${Math.round(-fallers[0].d * 100)}% compared with the ${plabel.toLowerCase()} before.`, go: '#inventory'});
  }
  const aRev = grades.find(g => g.name === 'A');
  if (aRev) sig.push({lvl: 'info', type: 'Grade mix', text: `A-grade is ${Math.round(aRev.rev / totRev * 100)}% of your money. Every extra A-grade piece you find when sorting is worth the most.`, go: '#sorting'});
  const topBrand = S.brands.find(b => b.brand !== 'No brand');
  if (topBrand) sig.push({lvl: 'info', type: 'Top brand', text: `${topBrand.brand} is the brand you sort most (${num(topBrand.pieces)} pcs, ${Math.round(topBrand.a_pieces / topBrand.pieces * 100)}% A-grade). Branded A-grade pieces are the ones to sell as premium.`, go: '#sorting'});

  return top + tabs + `
  <div class="grid kpis">
    <div class="card kpi gold"><div class="l">🏆 Best seller (pieces)</div><div class="v sm">${esc(label(best.key))}</div><div class="h">${num(best.pcs)} pcs · ${trend(best) || rs(best.rev)}</div></div>
    <div class="card kpi"><div class="l">💰 Top earner</div><div class="v sm">${esc(label(earner.key))}</div><div class="h">${rs(earner.rev)} · ${num(earner.pcs)} pcs</div></div>
    <div class="card kpi"><div class="l">Top category</div><div class="v sm">${esc(topCat.name)}</div><div class="h">${rs(topCat.rev)} · ${num(topCat.pcs)} pcs</div></div>
    <div class="card kpi"><div class="l">Best wholesaler</div><div class="v sm">${esc(cust(custList[0].id).name)}</div><div class="h">${rs(custList[0].rev)} · ${custList[0].orders} orders</div></div>
    <div class="card kpi"><div class="l">Total sold</div><div class="v sm">${num(totPcs)} pcs</div><div class="h">${rs(totRev)} · avg ${rs(totRev / totPcs)}/pc</div></div>
  </div>
  <div class="card" style="margin-bottom:14px"><h2>What the numbers are telling you</h2>${sig.map(alertHtml).join('')}</div>
  <div class="card tbl" style="margin-bottom:14px"><h2>Every item ranked — ${plabel.toLowerCase()}</h2><table>

const canonBrand = v => { const t = (v || '').trim(); return brandList().find(x => x.toLowerCase() === t.toLowerCase()) || t; };
async function saveBrandList(list) {
  const seen = new Set(), out = [];
  list.map(x => x.trim()).filter(Boolean).forEach(x => { if (!seen.has(x.toLowerCase())) { seen.add(x.toLowerCase()); out.push(x); } });
  out.sort((a, b) => a.localeCompare(b));
  await q(tb('settings').update({brand_list: out, updated_at: new Date().toISOString()}).eq('id', 1));
  S.settings.brandList = out;
}
async function rememberBrand(v) {
  if (!S.settings.brandsReady || !v || v === 'No brand' || brandList().some(x => x.toLowerCase() === v.toLowerCase())) return;
  await saveBrandList([...S.settings.brandList, v]);
}

/* brand popup — one per piece counted */
let brandShowing = null, brandSnooze = 0;
function maybeBrandPopup() {
  const m = $('#modal');
  if (route()[0] !== 'sorting' || !S.pending.length) { if (!m.hidden && m.dataset.kind === 'brand' && !m.dataset.edit) m.hidden = true; return; }
  if (!m.hidden && m.dataset.kind !== 'brand') return;
  const next = S.pending.find(p => p.id > brandSnooze);
  if (!next) return;
  if (!m.hidden && m.dataset.edit) return;

  openBrand(next);
}

function mdInline(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>'); }
function mdTable(rows) {
  const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
  const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r)), h = body.shift();
  return '<div class="tbl"><table><tr>' + cells(h).map(c => `<th>${mdInline(c)}</th>`).join('') + '</tr>' + body.map(r => '<tr>' + cells(r).map(c => `<td>${mdInline(c)}</td>`).join('') + '</tr>').join('') + '</table></div>';
}
function md(t) {
  const out = []; let list = false, tbl = null;
  const flush = () => { if (list) { out.push('</ul>'); list = false; } if (tbl) { out.push(mdTable(tbl)); tbl = null; } };
  for (const l of String(t).split('\n')) {
    if (/^\s*\|.*\|\s*$/.test(l)) { if (list) flush(); (tbl = tbl || []).push(l); continue; }
    if (tbl) flush();
    const m = l.match(/^\s*[-*•]\s+(.*)/);
    if (m) { if (!list) { out.push('<ul>'); list = true; } out.push('<li>' + mdInline(m[1]) + '</li>'); continue; }
    if (list) flush();
    const h = l.match(/^#{1,4}\s+(.*)/);
    out.push(h ? '<h3>' + mdInline(h[1]) + '</h3>' : l.trim() ? '<p>' + mdInline(l) + '</p>' : '');
  }
  flush();
  return out.join('');
}

function modal(title, body, onSave, saveText = 'Save', kind = '') {
  const m = $('#modal');
  m.innerHTML = `<form><h2>${title}</h2>${body}<div class="foot"><span class="err"></span><div class="btns"><button type="button" class="btn ghost" data-close>Close</button><button class="btn" type="submit">${saveText}</button></div></div></form>`;
  m.dataset.kind = kind; m.dataset.edit = '';
  m.hidden = false;
  const f = m.querySelector('form');
  f.querySelector('[data-close]').onclick = () => m.hidden = true;
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('[type=submit]'); btn.disabled = true;
    try {
      const err = await onSave(f);
      if (err) f.querySelector('.err').textContent = err;
      else { m.hidden = true; await refresh(); }
    } catch (x) { f.querySelector('.err').textContent = x.message; }
    btn.disabled = false;
  };
  const first = f.querySelector('input:not([type=hidden]),select'); first && first.focus();
  return f;
}

      orders: [['ID', 'Date', 'Wholesaler', 'City', 'Items', 'Pieces', 'Total', 'Paid', 'Due', 'Status', 'Courier', 'Tracking'], S.orders.map(o => [o.id, o.date, cust(o.customerId).name, cust(o.customerId).city, o.lines.map(l => `${label(l.key)} x${l.qty}`).join('; '), sum(o.lines, l => l.qty), total(o), o.paid, due(o), o.status, o.courier || '', o.tracking || ''])],
      customers: [['ID', 'Name', 'City', 'Phone', 'Credit limit', 'Owes'], S.customers.map(c => [c.id, c.name, c.city, c.phone, c.limit, custDue(c.id)])],
    }[what];
    const csv = [T2[0], ...T2[1]].map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
    download(`${what}-${today()}.csv`, csv, 'text/csv');
  },
  backup() { download(`landa-backup-${today()}.json`, JSON.stringify(S, (k, v) => v instanceof Set ? [...v] : v), 'application/json'); },
  async demo() {
    if (!confirm('This WIPES all bales, orders and wholesalers and loads demo data. Continue?')) return;
    await loadDemo();
  },
  async wipe() {
    if (prompt('This deletes ALL bales, orders, wholesalers and history (categories and prices stay). Type WIPE to confirm.') !== 'WIPE') return;
    await rpc('wipe_all_business_data'); toast('Everything wiped — fresh start'); refresh();
  },
  async logout() {
    try { await sb.rpc(T('logout_dashboard')); } catch (e) {}
    sessionStorage.removeItem(TOKEN_KEY); location.hash = ''; location.reload();
  },
};
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); }

/* ---------- demo data ---------- */
async function loadDemo() {
  const say = t => toast(t, 60000);
  say('Loading demo data… 0%');
  await rpc('wipe_all_business_data');
  const base = {'Ladies Tops': 250, 'Jeans': 450, 'Jackets': 900, 'Sweaters': 400, 'Men Shirts': 300, 'Kids Wear': 180}, mult = {A: 1, B: .6, C: .3, Reject: .08};
  const cats = Object.keys(base);
  for (const c of cats) await rpc('add_category', {p_name: c});
  const price = (c, g) => Math.round(base[c] * mult[g] / 10) * 10;
  await Promise.all(cats.flatMap(c => GRADES.map(g => rpc('update_stock_item', {p_category: c, p_grade: g, p_qty: 0, p_price: price(c, g), p_min: g === 'A' ? 60 : g === 'B' ? 40 : 0}))));
  say('Loading demo data… 20%');
  const mk = (cs, pcs, aPct) => cs.flatMap(c => {
    const per = pcs / cs.length, a = Math.round(per * aPct), r = Math.round(per * .08), b = Math.round(per * (1 - aPct - .08) * .6);
    return [['A', a], ['B', b], ['C', Math.round(per) - a - b - r], ['Reject', r]].map(([grade, qty]) => ({category: c, grade, qty}));
  });
  const bales = [
    [28, 'UK Cream Export', 'Mixed Ladies', 450, 180000, 26, ['Ladies Tops', 'Jeans'], 1400, .45],
    [24, 'Korea Mix Traders', 'Winter Mix', 500, 160000, 22, ['Jackets', 'Sweaters'], 900, .30],
    [18, 'Gulf Bales (Dubai)', 'Mixed Men', 450, 120000, 16, ['Men Shirts', 'Jeans'], 1300, .22],
    [10, 'UK Cream Export', 'Kids + Ladies', 300, 110000, 9, ['Kids Wear', 'Ladies Tops'], 1200, .48],
    [6, 'Korea Mix Traders', 'Jeans', 450, 150000],
    [1, 'Gulf Bales (Dubai)', 'Mixed Ladies', 450, 115000],
  ];
  const baleIds = [];
  for (const [d, supplier, type, kg, cost, sd, cs, pcs, a] of bales) {
    const id = await rpc('add_bale', {p_date: ago(d), p_supplier: supplier, p_type: type, p_weight: kg, p_cost: cost});
    baleIds.push(id);
    if (sd) await rpc('record_bulk_sorting', {p_bale: id, p_yields: mk(cs, pcs, a), p_finish: true, p_date: ago(sd)});
  }
  say('Loading demo data… 45%');
  const cids = [];
  for (const [name, city, phone, limit] of [['Haji Rafiq Traders', 'Karachi', '923001234567', 300000], ['Al-Madina Garments', 'Lahore', '923211234567', 250000],
    ['Faisal Cloth House', 'Faisalabad', '923331234567', 60000], ['Karkhano Wholesale', 'Peshawar', '923451234567', 200000]])
    cids.push(await rpc('save_customer', {p_id: null, p_name: name, p_city: city, p_phone: phone, p_limit: limit}));
  const orders = [
    [20, 0, [['Ladies Tops', 'A', 200], ['Jeans', 'A', 120]], 'delivered', 1],
    [15, 1, [['Jackets', 'A', 80], ['Sweaters', 'B', 100]], 'delivered', .5],
    [14, 2, [['Men Shirts', 'B', 200], ['Jeans', 'B', 150]], 'delivered', 0],
    [12, 3, [['Jeans', 'A', 60], ['Ladies Tops', 'A', 90]], 'delivered', 1],
    [8, 0, [['Jeans', 'A', 150], ['Kids Wear', 'A', 150]], 'dispatched', 0],
    [5, 3, [['Jackets', 'B', 60], ['Sweaters', 'A', 80], ['Jeans', 'A', 100]], 'packed', 0],
    [1, 1, [['Kids Wear', 'B', 120], ['Ladies Tops', 'B', 150], ['Jeans', 'A', 50]], 'new', .3],
    [0, 2, [['Ladies Tops', 'A', 100]], 'new', 0],
  ];
  for (const [d, ci, lines, st, paidPct] of orders) {
    const ls = lines.map(([category, grade, qty]) => ({category, grade, qty, price: price(category, grade)}));
    const tot = sum(ls, l => l.qty * l.price);
    const id = await rpc('create_order', {p_customer: cids[ci], p_date: ago(d), p_lines: ls, p_paid: Math.round(tot * paidPct)});
    const steps = FLOW.slice(1, FLOW.indexOf(st) + 1);
    for (let i = 0; i < steps.length; i++)
      await rpc('set_order_status', {p_order: id, p_status: steps[i], p_courier: ['TCS', 'Daewoo Cargo', 'Leopards'][i % 3], p_tracking: 'TRK' + (700000 + d * 37), p_date: ago(Math.max(0, d - 1 - i))});
  }
  say('Loading demo data… 75%');
  const live = baleIds[4];
  await q(tb('live_sorting_session').update({bale_id: live, category: null, updated_at: new Date().toISOString()}).eq('id', 1));
  const brands = ["Levi's", "Levi's", 'Wrangler', 'Lee', 'Zara', "Levi's", 'H&M', 'Diesel', 'Wrangler', 'No brand', "Levi's", 'Lee', 'Zara', 'Tommy Hilfiger', "Levi's", 'Calvin Klein', 'Wrangler', 'H&M'];
  for (let i = 0; i < brands.length + 2; i++)
    await rpc('record_one_piece', {p_grade: ['A', 'A', 'B', 'A', 'C', 'B', 'A', 'Reject'][i % 8], p_category: i < brands.length ? 'Jeans' : null, p_brand: brands[i] || null});
  say('Demo data loaded ✓');
  location.hash = '#dashboard';
  await refresh();
}

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  e.preventDefault();
  if (b.disabled) return;
  const done = () => { b.disabled = false; };
  if (b.tagName === 'BUTTON') b.disabled = true;
  Promise.resolve().then(() => ACT[b.dataset.act](b.dataset.id)).catch(err => toast(err.message)).finally(done);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) { $('#modal [data-close]')?.click(); return; }
  if (route()[0] !== 'sorting' || !$('#modal').hidden || !S?.live.baleId || !$('.counters')) return;
  if (/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  const g = {a: 'A', b: 'B', c: 'C', r: 'Reject'}[e.key.toLowerCase()];
  if (g) { e.preventDefault(); ACT.piece(g).catch(err => toast(err.message)); }
  else if (e.key.toLowerCase() === 'u') { e.preventDefault(); ACT.undo().catch(err => toast(err.message)); }
});

function render(keep) {
  if (!S) return;
  const [pg, arg] = route();
  const p = PAGES[pg] ? pg : 'dashboard';
  let saved = null, focusName = null;
  const y = window.scrollY;
  if (keep) {
    saved = [...$('#app').querySelectorAll('input[name]:not([data-nokeep]),select[name]:not([data-nokeep])')].filter(e => e.type !== 'checkbox').map(e => [e.name, e.value]);
    focusName = $('#app').contains(document.activeElement) ? document.activeElement.name : null;
  }
  drawNav();
  $('#app').innerHTML = PAGES[p](arg);
  if (saved) saved.forEach(([n, v]) => { const e = $('#app').querySelector(`[name="${CSS.escape(n)}"]:not([data-nokeep])`); if (e) e.value = v; });
  AFTER[p] && AFTER[p](arg);
  if (!keep) entrance($('#app'));
  if (keep) { window.scrollTo(0, y); if (focusName) $('#app').querySelector(`[name="${CSS.escape(focusName)}"]`)?.focus(); }
  else window.scrollTo(0, 0);
  maybeBrandPopup();
}
window.addEventListener('hashchange', () => render());
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) refresh(); });
setInterval(() => { if (S && !document.hidden) refresh(); }, 60000);
start();
</script>
